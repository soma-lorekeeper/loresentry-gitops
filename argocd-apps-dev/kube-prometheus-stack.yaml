apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "91.8.2"
    helm:
      valuesObject:
        fullnameOverride: kps

        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            windows: false

        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        # 경보의 유일한 출구. 규약은 docs ALERTING.md(severity·묶기·억제·메시지 형식), 흐름은 ALERTING_ARCHITECTURE.md
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            # Slack bot token(Git 밖 Secret, key bot-token)을 /etc/alertmanager/secrets/alertmanager-slack/에 붙인다.
            # 마운트가 필수라 Secret이 없으면 파드가 뜨지 못한다. 만드는 법은 bootstrap/dev/05-cluster-bootstrap.sh
            secrets:
              - alertmanager-slack

          # Helm은 목록을 합치지 않고 통째로 바꾸므로, kps 기본값(null 받는 곳, Watchdog 경로, 억제 3개)도 여기에 옮겨 적는다
          config:
            global:
              resolve_timeout: 5m
            route:
              # 경로에 걸리지 않은 경보(severity가 없는 것 등)는 보내지 않는다
              receiver: "null"
              # 메시지 하나 = 묶음 하나 = (경보 이름, namespace, service). 나중에 AI 진단도 이 단위로 한다
              group_by: [alertname, namespace, service]
              # 새 묶음의 첫 알림 전에 같은 묶음의 경보를 모으는 시간
              group_wait: 30s
              # 묶음 내용이 바뀌었을 때(경보 추가·해소) 메시지를 고치는 간격
              group_interval: 5m
              # 바뀐 것 없이 계속 울릴 때 다시 알리는 간격(아래 경로마다 덮어쓴다)
              repeat_interval: 12h
              routes:
                # Watchdog은 경보 경로가 살아 있다는 신호일 뿐이다
                - receiver: "null"
                  matchers: ['alertname = "Watchdog"']
                # info와 none(InfoInhibitor)은 Slack에 보내지 않고 Grafana 경보 화면에서만 본다
                - receiver: "null"
                  matchers: ['severity =~ "none|info"']
                # critical: 사용자 영향이 지금 있거나 곧 생김. @channel, 4시간마다 다시 알림
                - receiver: slack
                  matchers: ['severity = "critical"']
                  repeat_interval: 4h
                # warning: 확인이 필요하지만 즉시 장애는 아님. 12시간마다 다시 알림
                - receiver: slack
                  matchers: ['severity = "warning"']
                  repeat_interval: 12h
            inhibit_rules:
              # kps 기본: 같은 경보 이름·namespace에서 critical이 warning·info를, warning이 info를 가린다
              - source_matchers: ['severity = "critical"']
                target_matchers: ['severity =~ "warning|info"']
                equal: [namespace, alertname]
              - source_matchers: ['severity = "warning"']
                target_matchers: ['severity = "info"']
                equal: [namespace, alertname]
              # kps 기본: InfoInhibitor가 있는 namespace의 info를 가리고, InfoInhibitor 자신은 보내지 않는다
              - source_matchers: ['alertname = "InfoInhibitor"']
                target_matchers: ['severity = "info"']
                equal: [namespace]
              - target_matchers: ['alertname = "InfoInhibitor"']
              # 우리 규칙: 앱 파드가 하나도 없으면 같은 서비스에서 따라 울리는 warning(지연·오류율·지표 수집 실패)을 가린다
              - source_matchers: ['alertname = "AppDeploymentUnavailable"']
                target_matchers: ['severity = "warning"']
                equal: [namespace, service]
            receivers:
              - name: "null"
              - name: slack
                slack_configs:
                  # bot token 방식. update_message는 api_url이 정확히 chat.postMessage일 때만 켤 수 있다
                  - api_url: https://slack.com/api/chat.postMessage
                    http_config:
                      authorization:
                        credentials_file: /etc/alertmanager/secrets/alertmanager-slack/bot-token
                    channel: "#alerts-dev"
                    send_resolved: true
                    # 같은 묶음의 반복·추가·해소는 처음 메시지를 고친다(진단 답글이 그 메시지 스레드에 달린다)
                    update_message: true
                    message_text: '{{ template "lore.slack.message_text" . }}'
                    # 비워 두면 Operator가 빈 값을 빼서 Alertmanager 기본 제목(클러스터 안 주소로 링크)이 들어가므로 직접 정한다
                    title: '{{ template "lore.slack.title" . }}'
                    title_link: '{{ template "lore.slack.title_link" . }}'
                    text: '{{ template "lore.slack.text" . }}'
                    color: '{{ template "lore.slack.color" . }}'
                    fallback: '{{ template "lore.slack.headline" . }}'
            templates:
              - /etc/alertmanager/config/*.tmpl

          # /etc/alertmanager/config/slack.tmpl 로 들어간다. 형식은 docs ALERTING.md §3.4
          templateFiles:
            slack.tmpl: |-
              {{/* 막대 색: 해소 초록, 울리는 critical 빨강, 그 밖 노랑 */}}
              {{ define "lore.slack.color" -}}
              {{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}
              {{- end }}

              {{/* 첫 줄: [CRITICAL|WARNING|RESOLVED] 경보 이름 · namespace/service.
                   kps 기본 규칙은 service에 수집기 이름(kps-kube-state-metrics 등)이 붙어 오므로 namespace만 쓴다 */}}
              {{ define "lore.slack.headline" -}}
              [{{ if eq .Status "resolved" }}RESOLVED{{ else }}{{ .CommonLabels.severity | toUpper }}{{ end }}] {{ .CommonLabels.alertname }}
              {{- with .CommonLabels.namespace }} · {{ . }}
              {{- with $.CommonLabels.service }}{{ if not (match "^(kps-|kube-prometheus-stack-|argocd-)" .) }}/{{ . }}{{ end }}{{ end }}
              {{- end }}
              {{- end }}

              {{/* 막대 제목: 묶음 공통 summary(없으면 경보 이름). 누르면 Grafana 경보 목록이 열린다 */}}
              {{ define "lore.slack.title" -}}
              {{ with .CommonAnnotations.summary }}{{ . }}{{ else }}{{ .CommonLabels.alertname }}{{ end }}
              {{- end }}
              {{ define "lore.slack.title_link" -}}
              https://grafana-dev.loresentry.com/alerting/list?search={{ .CommonLabels.alertname }}
              {{- end }}

              {{/* 메시지 본문 줄(알림 미리보기에도 쓰인다). 울리는 중인 critical만 @channel을 붙인다.
                   메시지를 고칠 때는 Slack이 멘션을 다시 울리지 않는다 */}}
              {{ define "lore.slack.message_text" -}}
              {{ if and (eq .Status "firing") (eq .CommonLabels.severity "critical") }}<!channel> {{ end }}{{ template "lore.slack.headline" . }}
              {{- end }}

              {{/* 경보 하나의 핵심 라벨. 있는 것만 " · 이름 값"으로 이어 쓴다 */}}
              {{ define "lore.slack.labels" -}}
              {{ with .Labels.pod }} · pod {{ . }}{{ end }}{{ with .Labels.container }} · container {{ . }}{{ end }}
              {{- with .Labels.deployment }} · deployment {{ . }}{{ end }}{{ with .Labels.statefulset }} · statefulset {{ . }}{{ end }}
              {{- with .Labels.persistentvolumeclaim }} · pvc {{ . }}{{ end }}{{ with .Labels.uri }} · route {{ . }}{{ end }}
              {{- with .Labels.node }} · node {{ . }}{{ end }}
              {{- end }}

              {{/* 막대 안 본문: 공통 description, 경보마다 시각(KST)·라벨(공통 summary가 없으면 경보별 summary도), 링크, 끝줄 fp.
                   경보가 많으면 앞의 10건만 적는다(Slack 글자 수 한도). fp는 진단 서비스가 이 메시지를 찾는 열쇠다 */}}
              {{ define "lore.slack.text" -}}
              {{ with .CommonAnnotations.description }}{{ . }}
              {{ end -}}
              {{ range $i, $a := .Alerts }}{{ if lt $i 10 -}}
              • {{ if not $.CommonAnnotations.summary }}{{ with $a.Annotations.summary }}{{ . }} · {{ end }}{{ end }}시작 {{ $a.StartsAt | tz "Asia/Seoul" | date "01-02 15:04" }}{{ if eq $a.Status "resolved" }} · 해소 {{ $a.EndsAt | tz "Asia/Seoul" | date "15:04" }}{{ end }} KST{{ template "lore.slack.labels" $a }}
              {{ end }}{{ end -}}
              {{ if gt (len .Alerts) 10 }}(총 {{ len .Alerts }}건 중 10건만 표시)
              {{ end -}}
              <https://grafana-dev.loresentry.com/alerting/silence/new?alertmanager=alertmanager&matcher=alertname%3D{{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }}&matcher=namespace%3D{{ . }}{{ end }}|silence 만들기>
              {{- with .CommonAnnotations.runbook_url }} · <{{ . }}|runbook>{{ end }}
              {{- with .CommonAnnotations.kibana_url }} · <{{ . }}|Kibana 로그>{{ end }}
              fp: {{ range $i, $a := .Alerts }}{{ if lt $i 10 }}{{ if $i }} {{ end }}{{ $a.Fingerprint }}{{ end }}{{ end }}
              {{- end }}

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi

        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: 18GB
            scrapeInterval: 30s
            evaluationInterval: 30s
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi

          additionalServiceMonitors:
            - name: argocd
              namespaceSelector:
                matchNames:
                  - argocd
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - argocd-metrics
                      - argocd-server-metrics
                      - argocd-repo-server
                      - argocd-applicationset-controller
              endpoints:
                - port: metrics

          additionalPodMonitors:
            - name: strimzi-cluster-operator
              namespaceSelector:
                matchNames:
                  - strimzi-system
              selector:
                matchLabels:
                  strimzi.io/kind: cluster-operator
              podMetricsEndpoints:
                - path: /metrics
                  port: http

        grafana:
          fullnameOverride: grafana

          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi

          defaultDashboardsTimezone: Asia/Seoul

          grafana.ini:
            server:
              root_url: https://grafana-dev.loresentry.com
            analytics:
              check_for_updates: false
              reporting_enabled: false
            users:
              allow_sign_up: false
            auth.anonymous:
              enabled: false

          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
              alb.ingress.kubernetes.io/healthcheck-path: /api/health
              alb.ingress.kubernetes.io/success-codes: "200-399"
            hosts:
              - grafana-dev.loresentry.com
            path: /
            pathType: Prefix

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: kafka
                  orgId: 1
                  folder: Kafka
                  type: file
                  disableDeletion: true
                  editable: false
                  options:
                    path: /var/lib/grafana/dashboards/kafka

          dashboards:
            kafka:
              strimzi-kafka:
                url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.2.0/packaging/examples/metrics/grafana-dashboards/strimzi-kafka.json
              strimzi-kraft:
                url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.2.0/packaging/examples/metrics/grafana-dashboards/strimzi-kraft.json
              strimzi-kafka-exporter:
                url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.2.0/packaging/examples/metrics/grafana-dashboards/strimzi-kafka-exporter.json
              strimzi-operators:
                url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.2.0/packaging/examples/metrics/grafana-dashboards/strimzi-operators.json

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
