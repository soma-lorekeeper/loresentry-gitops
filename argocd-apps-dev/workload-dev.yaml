apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://github.com/soma-lorekeeper/loresentry-gitops.git
    targetRevision: main
    path: workload/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
