# ES 사용자 정의 역할. ECK가 file realm 역할로 넣는다(elasticsearch.yaml spec.auth.roles).
# 비밀값이 없어 Git에 둔다. 사용자·비밀번호는 Git 밖 Secret logs-es-grafana-user(bootstrap/dev/05-cluster-bootstrap.sh)다.

# Grafana 경보·화면이 ES를 읽을 때 쓰는 읽기 전용 역할(docs ALERTING.md §6.4·§6.5·§6.6).
grafana_reader:
  # 클러스터 버전·상태 조회. Grafana 데이터 소스가 연결을 확인할 때 쓴다
  cluster: ["monitor"]
  indices:
    # 로그, APM trace, 앱 지표(EDOT Collector가 쓰는 metrics-*.otel-*), 로그 스택 모니터링(Metricbeat sidecar가 쓰는 곳).
    # 검색과 매핑 조회만 한다
    - names: ["logs-*", "traces-*", "metrics-*", ".monitoring-*"]
      privileges: ["read", "view_index_metadata"]
    # 색인이 거부된 문서(failure store, logs-*::failures). read에는 포함되지 않아 따로 준다
    - names: ["logs-*"]
      privileges: ["read_failure_store"]
