# 로그 저장소. ECK operator가 이 CR을 보고 StatefulSet·Service·TLS 인증서·elastic 계정 Secret을 만든다.
# 만들어지는 것: Service logs-es-http(9200, HTTPS), Secret logs-es-elastic-user(elastic 비밀번호),
#               Secret logs-es-http-certs-public(클라이언트가 믿을 CA).
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logs
  annotations:
    # wave 0: 가장 먼저 뜬다. 같은 앱 안에서는 이 리소스가 Healthy(green)가 된 뒤에 다음 wave로 넘어간다.
    argocd.argoproj.io/sync-wave: "0"
spec:
  version: 9.5.5

  # 기본값(DeleteOnScaledownAndClusterDeletion)은 이 CR을 지우면 데이터 디스크도 지운다.
  # 실수로 CR을 지워도 30일치 로그가 남도록 디스크는 남기고, 지우는 건 사람이 확인한 뒤에 한다.
  volumeClaimDeletePolicy: DeleteOnScaledownOnly

  # elastic 말고 용도별 계정. 역할과 사용자를 바꿔도 ES는 재시작하지 않는다(ECK가 file realm을 다시 쓰면 1~2분 안에 반영).
  auth:
    # 사용자 정의 역할(roles.yml, kustomization.yaml의 secretGenerator)
    roles:
      - secretName: logs-es-roles
    # 사용자. kubernetes.io/basic-auth Secret(username·password·roles)이고 Git 밖에서 만든다(bootstrap/dev/05-cluster-bootstrap.sh)
    fileRealm:
      # Grafana가 로그·로그 스택 경보를 위해 읽는 계정(역할 grafana_reader)
      - secretName: logs-es-grafana-user

  # 로그 스택 자신의 상태를 Stack Monitoring으로 남긴다(docs ALERTING.md §8). ECK가 파드마다 Metricbeat sidecar를 붙여
  # 이 구성요소의 상태 API를 10초마다 읽어 같은 ES(logs)의 .monitoring-*에 쓴다. Grafana 로그 스택 경보가 이것을 읽는다.
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: logs

  nodeSets:
    - name: default
      # 1대. 샤드 사본(replica)은 원본과 다른 노드에만 둘 수 있으므로 index template에서 0으로 둔다.
      count: 1
      config:
        # 노드 커널 설정(vm.max_map_count)을 바꾸지 않고 동작하게 mmap을 쓰지 않는다.
        node.store.allow_mmap: false
      podTemplate:
        spec:
          # 로깅 전용 노드(2b)에만 뜬다. 디스크(EBS)가 2b에 묶이므로 노드가 바뀌어도 같은 AZ에 다시 뜬다.
          nodeSelector:
            role: logging
          tolerations:
            - key: dedicated
              operator: Equal
              value: logging
              effect: NoSchedule
          containers:
            - name: elasticsearch
              # 힙은 ES가 메모리 상한을 보고 자동으로 정한다(대략 절반). 남는 메모리는 검색용 파일 캐시가 된다.
              resources:
                requests:
                  cpu: 500m
                  memory: 3Gi
                limits:
                  memory: 3Gi
            # Stack Monitoring sidecar(spec.monitoring). ECK는 자원값을 넣지 않으므로 Elastic의 Metricbeat 참고 매니페스트 값을 쓴다
            - name: metricbeat
              resources:
                requests:
                  cpu: 100m
                  memory: 100Mi
                limits:
                  memory: 200Mi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: gp3
            resources:
              requests:
                # 로그(30일)와 APM traces·지표(30일)를 함께 둔다. 부하 테스트 중 실측(2026-11-04)은 로그 하루 약 1GB,
                # traces 하루 약 4GB였다. 디스크가 95%를 넘으면 ES가 index를 읽기 전용으로 바꿔 수집이 멈춘다.
                # gp3(allowVolumeExpansion)라 ECK가 PVC를 그 자리에서 늘린다. EBS는 줄일 수 없으므로 늘리기만 한다.
                storage: 128Gi
