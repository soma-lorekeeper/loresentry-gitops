# component template(logs@custom, traces-otel@custom, metrics-otel@custom)을 ES에 넣는 일회성 Job.
# template은 Kubernetes 리소스가 아니라 ES 안에 저장되는 설정이라 Argo CD가 직접 적용할 수 없다.
# 이 Job이 Git의 *-custom.json을 ES API로 옮긴다. sync마다 다시 돌아 ES 쪽 값을 Git과 같게 맞춘다.
apiVersion: batch/v1
kind: Job
metadata:
  name: logs-index-template
  annotations:
    # wave 1: ES(wave 0)가 green이 된 뒤, 로그·span을 보내는 Logstash·Filebeat·EDOT Collector(wave 2)보다 먼저 돈다.
    # 첫 data stream이 생기기 전에 레플리카 0이 들어가야 1노드 ES가 yellow가 되지 않는다.
    # PostSync가 아니라 Sync hook인 이유: ES가 한 번 yellow가 되면 PostSync는 영영 실행되지 않는다.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    # 다음 sync 때 이전 Job을 지우고 새로 만든다.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        role: logging
      tolerations:
        - key: dedicated
          operator: Equal
          value: logging
          effect: NoSchedule
      containers:
        - name: put-template
          # 같은 노드의 ES가 이미 받아 둔 이미지라 따로 내려받지 않는다. curl만 쓴다.
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              es=https://logs-es-http:9200
              auth=(--cacert /ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}")
              # ES가 요청을 받을 때까지 기다린다(최대 10분).
              for _ in $(seq 1 60); do
                curl -sf "${auth[@]}" "${es}/_cluster/health" >/dev/null && break
                sleep 10
              done
              curl -sf "${auth[@]}" -X PUT "${es}/_component_template/logs@custom" \
                -H 'Content-Type: application/json' --data-binary @/template/logs-custom.json
              echo
              echo "logs@custom applied"
              # EDOT Collector가 쓰는 traces·metrics(*.otel-*)의 레플리카 0·보존 30일. span event(logs-*.otel-*)는 logs@custom이 맡는다.
              for kind in traces metrics; do
                curl -sf "${auth[@]}" -X PUT "${es}/_component_template/${kind}-otel@custom" \
                  -H 'Content-Type: application/json' --data-binary @"/template/${kind}-otel-custom.json"
                echo
                echo "${kind}-otel@custom applied"
              done
              # ES 파드의 Metricbeat sidecar(Stack Monitoring)는 Stack Monitoring 형식이 없는 ingest_pipeline 지표를
              # metricbeat-<버전> data stream에 쓴다. sidecar가 넣는 template은 레플리카 1·삭제 없는 ILM이라 1노드 ES가
              # yellow가 되고 wave 2가 멈춘다. 더 높은 우선순위 template으로 레플리카 0·보존 3일(.monitoring-*와 같음)을 정하고,
              # 이미 있는 data stream에도 맞춘다(처음 만들 때는 아직 없으므로 실패해도 넘어간다).
              curl -sf "${auth[@]}" -X PUT "${es}/_index_template/metricbeat-sidecar" \
                -H 'Content-Type: application/json' \
                -d '{"index_patterns":["metricbeat-*"],"data_stream":{},"priority":500,"template":{"settings":{"index.number_of_replicas":0,"index.lifecycle.prefer_ilm":false},"lifecycle":{"data_retention":"3d"}}}'
              echo
              curl -sf "${auth[@]}" -X PUT "${es}/metricbeat-*/_settings?expand_wildcards=all" \
                -H 'Content-Type: application/json' \
                -d '{"index":{"number_of_replicas":0,"lifecycle.prefer_ilm":false}}' || echo "no metricbeat indices yet"
              echo
              curl -sf "${auth[@]}" -X PUT "${es}/_data_stream/metricbeat-*/_lifecycle" \
                -H 'Content-Type: application/json' -d '{"data_retention":"3d"}' || echo "no metricbeat data stream yet"
              echo
              echo "metricbeat-sidecar template applied"
          env:
            # ECK가 만든 elastic 계정 비밀번호.
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logs-es-elastic-user
                  key: elastic
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: template
              mountPath: /template
              readOnly: true
      volumes:
        # ES HTTPS 인증서를 믿기 위한 CA. ECK가 만든다.
        - name: ca
          secret:
            secretName: logs-es-http-certs-public
        # logs-custom.json. kustomization의 configMapGenerator가 만든다.
        - name: template
          configMap:
            name: logs-custom-template
