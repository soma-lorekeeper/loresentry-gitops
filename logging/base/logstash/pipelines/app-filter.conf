# app pipeline 가공: Filebeat가 보낸 파드 로그 한 줄(Kafka·Strimzi는 여러 줄 묶음)을 LOG_SCHEMA.md 규약에 맞춘다.
#
# 순서
#   1. 출처 고르기     파드 label로 dataset·service.name·파싱 방식을 정한다 (LOG_SCHEMA.md 6절)
#   2. 파싱            방식마다 레벨 후보를 [@metadata][level]에 모은다. 파싱에 성공하면 원래 줄을 event.original에 남긴다
#   3. log.level       후보를 7개 값(trace·debug·info·warn·error·fatal·unknown)으로 바꾼다 (3절)
#   4. 소음 제거       2xx 헬스체크 접근 로그를 버린다 (4절)
#   5. 마스킹          금지 항목을 지운다 (4절, mask.rb)
#   6. 공통 필드       data stream·환경·클러스터 필드를 채운다 (2절)
#
# Filebeat는 label 이름의 '.'을 '_'로 바꿔 보낸다. app.kubernetes.io/name → [kubernetes][labels][app_kubernetes_io/name]
# ${ENVIRONMENT}·${CLUSTER_NAME}은 overlay가 Logstash 컨테이너에 넣는 환경 변수다.
filter {
  # 마스킹 전 원래 줄. 파싱에 성공한 경우에만 event.original로 옮긴다.
  # beats 입력이 원래 줄을 event.original에 미리 넣어 두므로 지운다. 두면 아래에서 한 번 더 넣을 때 배열이 되고,
  # 파싱하지 않은 줄도 같은 내용을 두 번 저장한다.
  mutate {
    copy => { "message" => "[@metadata][original]" }
    remove_field => ["[event][original]"]
  }

  # ---------------------------------------------------------------- 1. 출처 고르기
  # [@metadata][format]: 이 줄을 어떤 방식으로 파싱할지
  #   ecs   우리 서비스. 앱이 ECS JSON 한 줄을 낸다(앱 로그 규약). JSON이 아닌 줄은 파싱하지 않는다
  #   log4j Kafka 브로커, Strimzi operator
  #   valkey auth-valkey
  #   other 그 밖의 파드. 형식을 모르므로 레벨만 찾아본다
  if [kubernetes][labels][app_kubernetes_io/part-of] == "lore-sentry" and [kubernetes][labels][app_kubernetes_io/name] in ["gateway-api", "authentication-api", "content-api", "ai-chat-api", "ai-chat-summarizer", "graph-rag-api"] {
    mutate {
      add_field => {
        "[@metadata][format]" => "ecs"
        "[@metadata][service]" => "%{[kubernetes][labels][app_kubernetes_io/name]}"
        "[@metadata][dataset]" => "loresentry.%{[kubernetes][labels][app_kubernetes_io/name]}"
      }
    }
    # data stream 이름에서 '-'는 구분자라 dataset에는 '_'를 쓴다. gateway-api → loresentry.gateway_api
    mutate {
      gsub => ["[@metadata][dataset]", "-", "_"]
    }
  } else if [kubernetes][labels][strimzi_io/component-type] == "kafka" {
    # 브로커만 고른다. entity-operator·kafka-exporter 파드에도 strimzi.io/kind: Kafka가 붙어 있어 kind로는 못 나눈다.
    mutate {
      add_field => {
        "[@metadata][format]" => "log4j"
        "[@metadata][service]" => "kafka"
        "[@metadata][dataset]" => "kafka.log"
      }
    }
  } else if [kubernetes][labels][strimzi_io/component-type] == "entity-operator" or [kubernetes][labels][strimzi_io/kind] == "cluster-operator" {
    # topic-operator·user-operator(entity-operator 파드)와 cluster-operator. 어느 것인지는 container.name으로 구분한다.
    mutate {
      add_field => {
        "[@metadata][format]" => "log4j"
        "[@metadata][service]" => "strimzi-operator"
        "[@metadata][dataset]" => "strimzi.operator"
      }
    }
  } else if [kubernetes][labels][app_kubernetes_io/part-of] == "lore-sentry" and [kubernetes][labels][app_kubernetes_io/name] == "auth-valkey" {
    mutate {
      add_field => {
        "[@metadata][format]" => "valkey"
        "[@metadata][service]" => "auth-valkey"
        "[@metadata][dataset]" => "valkey.log"
      }
    }
  } else {
    # openai-mock, kafka-exporter, 로깅·모니터링·Argo CD·kube-system 등.
    # service.name은 label app.kubernetes.io/name, 없으면 컨테이너 이름.
    mutate {
      add_field => {
        "[@metadata][format]" => "other"
        "[@metadata][dataset]" => "kubernetes.container"
      }
    }
    if [kubernetes][labels][app_kubernetes_io/name] {
      mutate {
        add_field => { "[@metadata][service]" => "%{[kubernetes][labels][app_kubernetes_io/name]}" }
      }
    } else if [kubernetes][container][name] {
      mutate {
        add_field => { "[@metadata][service]" => "%{[kubernetes][container][name]}" }
      }
    }
  }

  # ---------------------------------------------------------------- 2. 파싱
  if [@metadata][format] == "ecs" {
    # ECS JSON을 문서 최상위로 펼친다. 앱이 보낸 @timestamp·message·log.level 등이 그대로 필드가 된다.
    # 중첩 객체 형식이어야 한다({"log":{"level":"INFO"}}). Spring Boot 4의 ECS 출력이 이 형식이다.
    # "ecs":{...}가 있는 줄만 펼친다. 규약 밖의 JSON(지금의 summarizer 등)을 펼치면 time·level 같은 임의 필드가 생기고,
    # host·service처럼 ECS 객체 이름과 같은 문자열 키가 공통 필드 채우기를 깨뜨린다. 그런 줄은 평문처럼 그대로 둔다.
    if [message] =~ /^\{/ and [message] =~ /"ecs"\s*:\s*\{/ {
      json {
        source => "message"
        add_field => { "[event][original]" => "%{[@metadata][original]}" }
      }
    }
    if [log][level] {
      mutate {
        copy => { "[log][level]" => "[@metadata][level]" }
      }
    }
  } else if [@metadata][format] == "log4j" {
    # Kafka 브로커: 2026-10-31 08:47:20 INFO  [thread] GroupMetadataManager:4180 - 본문
    # Strimzi:      2026-10-31 10:42:01 INFO  TopicEventHandler:49 - 본문
    # Filebeat가 예외 줄을 앞 줄에 붙여 보내므로 (?m)로 본문이 여러 줄이어도 끝까지 받는다.
    # 시각은 초 단위라 쓰지 않고, 런타임이 붙인 나노초 시각(@timestamp)을 그대로 둔다.
    grok {
      match => {
        "message" => "(?m)^%{TIMESTAMP_ISO8601} %{LOG4J_LEVEL:[@metadata][level]}\s+(?:\[%{DATA:[process][thread][name]}\] )?%{LOG4J_CLASS:[log][logger]}(?::%{INT:[log][origin][file][line]:int})? - %{GREEDYDATA:message}"
      }
      pattern_definitions => {
        "LOG4J_LEVEL" => "[A-Z]+"
        "LOG4J_CLASS" => "[^\s:]+"
      }
      overwrite => ["message"]
      add_field => { "[event][original]" => "%{[@metadata][original]}" }
    }
  } else if [@metadata][format] == "valkey" {
    # 1:M 31 Oct 2026 09:41:11.266 * 본문   (pid:역할 시각 레벨 기호)
    grok {
      match => {
        "message" => "^%{INT:[process][pid]:int}:%{VALKEY_ROLE} %{MONTHDAY} %{MONTH} %{YEAR} %{TIME} %{VALKEY_LEVEL:[@metadata][level]} %{GREEDYDATA:message}"
      }
      pattern_definitions => {
        # M 주, S 복제본, C 저장용 자식 프로세스, X sentinel
        "VALKEY_ROLE" => "[MSCX]"
        "VALKEY_LEVEL" => "[.*#-]"
      }
      overwrite => ["message"]
      add_field => { "[event][original]" => "%{[@metadata][original]}" }
    }
  } else {
    # 형식을 모르는 파드는 줄을 바꾸지 않고 레벨만 찾는다. 못 찾으면 unknown이 되므로 실패 태그는 붙이지 않는다.
    # JSON 줄은 필드를 펼치지 않는다. 남의 JSON이 service.name·event.dataset 같은 필드를 덮어쓰거나 필드 수를 늘리지 않게 한다.
    if [message] =~ /^\{/ {
      json {
        source => "message"
        target => "[@metadata][json]"
        tag_on_failure => []
      }
      # zap·Python({"level":..}), ECS 평면 키({"log.level":..}, ES·ECK·Beats), ECS 중첩({"log":{"level":..}}, Kibana)
      if [@metadata][json][level] {
        mutate { copy => { "[@metadata][json][level]" => "[@metadata][level]" } }
      } else if [@metadata][json][log.level] {
        mutate { copy => { "[@metadata][json][log.level]" => "[@metadata][level]" } }
      } else if [@metadata][json][log][level] {
        mutate { copy => { "[@metadata][json][log][level]" => "[@metadata][level]" } }
      }
    }
    if ![@metadata][level] {
      grok {
        match => {
          "message" => [
            # logfmt: Argo CD, Prometheus, Grafana, Alertmanager (level=info)
            "(?:^|\s)level=\"?%{OTHER_LEVEL_WORD:[@metadata][level]}",
            # klog: kube-proxy, EBS CSI, kafka-exporter (I1031 08:44:08.947803 ...)
            "^%{KLOG_LEVEL:[@metadata][level]}\d{4} \d{2}:\d{2}:\d{2}",
            # Redis·Valkey 형식: argocd-redis (1:M 29 Oct 2026 12:44:53.224 * 본문)
            "^\d+:[MSCX] \d{1,2} [A-Z][a-z]{2} \d{4} [\d:.]+ %{REDIS_LEVEL:[@metadata][level]} ",
            # Go 런타임 panic: 프로세스가 죽는 줄이다 (panic: ...)
            "^%{GO_PANIC:[@metadata][level]}: ",
            # 앞부분의 대문자 레벨 단어: CoreDNS [INFO], Logstash [INFO ], Telepresence, log4j 등
            "^.{0,40}?\b%{OTHER_LEVEL_UPPER:[@metadata][level]}\b"
          ]
        }
        pattern_definitions => {
          "OTHER_LEVEL_WORD" => "[A-Za-z]+"
          "KLOG_LEVEL" => "[IWEF]"
          "REDIS_LEVEL" => "[.*#-]"
          "GO_PANIC" => "panic"
          "OTHER_LEVEL_UPPER" => "TRACE|DEBUG|INFO|NOTICE|WARNING|WARN|ERROR|FATAL|CRITICAL"
        }
        tag_on_failure => []
      }
    }
  }

  # ---------------------------------------------------------------- 3. log.level
  mutate {
    lowercase => ["[@metadata][level]"]
  }
  translate {
    source => "[@metadata][level]"
    target => "[log][level]"
    override => true
    fallback => "unknown"
    dictionary => {
      # 공통 단어
      "trace" => "trace"
      "debug" => "debug"
      "info" => "info"
      "notice" => "info"
      "warn" => "warn"
      "warning" => "warn"
      "error" => "error"
      "err" => "error"
      "fatal" => "fatal"
      "critical" => "fatal"
      "crit" => "fatal"
      # zap(Go): dpanic은 운영에서 error로 남는다
      "dpanic" => "error"
      "panic" => "fatal"
      # Valkey 기호
      "." => "debug"
      "-" => "debug"
      "*" => "info"
      "#" => "warn"
      # klog 첫 글자 (소문자로 바뀐 뒤)
      "i" => "info"
      "w" => "warn"
      "e" => "error"
      "f" => "fatal"
    }
  }
  # 레벨이 없는 줄. 접근 로그처럼 응답 상태가 있으면 상태로 정하고, 없으면 unknown.
  if ![log][level] {
    if [http][response][status_code] and [http][response][status_code] >= 500 {
      mutate { add_field => { "[log][level]" => "error" } }
    } else if [http][response][status_code] and [http][response][status_code] >= 400 {
      mutate { add_field => { "[log][level]" => "warn" } }
    } else if [http][response][status_code] {
      mutate { add_field => { "[log][level]" => "info" } }
    } else {
      mutate { add_field => { "[log][level]" => "unknown" } }
    }
  }

  # ---------------------------------------------------------------- 4. 소음 제거
  # kubelet probe(/health)가 성공한 접근 로그. 실패(4xx·5xx)는 남긴다. 앱 로그 규약의 ECS 필드로만 판단한다.
  if [@metadata][format] == "ecs" and [url][path] == "/health" and [http][response][status_code] and [http][response][status_code] >= 200 and [http][response][status_code] < 300 {
    drop {}
  }

  # ---------------------------------------------------------------- 5. 마스킹
  ruby {
    path => "/usr/share/logstash/pipelines/mask.rb"
  }

  # ---------------------------------------------------------------- 6. 공통 필드
  if [@metadata][service] and ![service][name] {
    mutate {
      add_field => { "[service][name]" => "%{[@metadata][service]}" }
    }
  }
  # Filebeat는 컨테이너 이름을 kubernetes.container.name에 둔다. ECS 필드 container.name으로도 둔다.
  if [kubernetes][container][name] and ![container][name] {
    mutate {
      copy => { "[kubernetes][container][name]" => "[container][name]" }
    }
  }
  # ES output이 이 세 값으로 data stream logs-<dataset>-<env>를 고른다. 다른 mutate가 필드 충돌로 실패해도
  # (_mutate_error) 보관함은 맞게 가도록 따로 둔다.
  mutate {
    replace => {
      "[data_stream][type]" => "logs"
      "[data_stream][dataset]" => "%{[@metadata][dataset]}"
      "[data_stream][namespace]" => "${ENVIRONMENT}"
    }
  }
  mutate {
    replace => {
      "[event][dataset]" => "%{[@metadata][dataset]}"
      "[service][environment]" => "${ENVIRONMENT}"
      "[orchestrator][type]" => "kubernetes"
      "[orchestrator][cluster][name]" => "${CLUSTER_NAME}"
      # Filebeat가 붙인 값(8.0.0)이나 앱이 보낸 값 대신 규약 버전으로 맞춘다.
      "[ecs][version]" => "8.11"
    }
  }
  # Filebeat 파드 이름이 아니라 노드 호스트 이름. 앱 JSON의 문자열 host와 부딪힐 수 있어 따로 둔다
  # (한 mutate 안에서 하나가 실패하면 나머지도 적용되지 않고, 적용 순서도 적은 순서가 아니다).
  mutate {
    replace => { "[host][name]" => "%{[kubernetes][node][name]}" }
  }
}
