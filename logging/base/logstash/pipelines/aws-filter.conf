# aws pipeline 가공: AWS 관리형 로그를 LOG_SCHEMA.md 규약에 맞춘다.
#
# 순서
#   1. 출처 고르기   Filebeat 입력이 붙인 [fields][aws_source]와 EKS 로그 스트림 이름으로 정한다
#   2. 파싱          출처마다 ECS 필드로 옮기고 log.level을 정한다 (3절, 8절). 복잡한 출처는 aws-*.rb가 맡는다
#   3. 마스킹        mask.rb (4절). URL 쿼리의 code·state·클릭 ID, PASSWORD '...', Key (...)=(...) 등
#   4. 공통 필드     data stream(logs-aws.<출처>-<env>)·환경 필드 (2.1절, 6절)
#
# 출처: alb·cloudfront(S3 원천 버킷), rds·neptune·eks(CloudWatch 로그 그룹). 로그를 켜는 것은 6단계다.
filter {
  # 마스킹 전 원래 줄. 파싱한 로그만 event.original로 옮긴다. beats 입력이 미리 넣는 event.original은 지운다(app과 같음).
  mutate {
    copy => { "message" => "[@metadata][original]" }
    remove_field => ["[event][original]"]
  }

  # ---------------------------------------------------------------- 1. 출처 고르기
  if [fields][aws_source] {
    mutate { copy => { "[fields][aws_source]" => "[@metadata][source]" } }
  }
  # EKS 로그 그룹 하나에 여러 종류가 스트림 이름으로 나뉘어 들어온다. 켜는 것은 authenticator뿐이다.
  if [@metadata][source] == "eks" {
    if [aws][cloudwatch][log_stream] =~ /^authenticator/ {
      mutate { replace => { "[@metadata][source]" => "eks_authenticator" } }
    } else {
      mutate { replace => { "[@metadata][source]" => "unknown" } }
    }
  }
  # Filebeat가 붙인 출처 표시와 Filebeat 파드 이름(host.name)은 AWS 로그에 쓸모가 없어 지운다.
  mutate { remove_field => ["[fields]", "[host]"] }

  # ---------------------------------------------------------------- 2. 파싱
  if [@metadata][source] == "alb" {
    # ALB 접근 로그 한 줄. 칸은 공백으로 나뉘고 일부는 큰따옴표로 감싼다. 없는 값은 '-'다.
    # 칸 순서는 AWS 문서 load-balancer-access-log-entries. 뒤에 새 칸이 더해져도 받도록 끝을 열어 둔다.
    # message는 원래 줄 그대로 두므로 event.original은 만들지 않는다(마스킹은 message에 한다).
    grok {
      match => {
        "message" => '^%{ALB_TYPE:[aws][alb][type]} %{TIMESTAMP_ISO8601:[@metadata][alb][time]} %{NOTSPACE:[aws][alb][name]} %{IP:[source][ip]}:%{INT:[source][port]:int} (?:-|%{IP:[destination][ip]}:%{INT:[destination][port]:int}) %{ALB_SECS:[@metadata][alb][request_seconds]} %{ALB_SECS:[@metadata][alb][target_seconds]} %{ALB_SECS:[@metadata][alb][response_seconds]} (?:-|%{INT:[http][response][status_code]:int}) (?:-|%{INT:[aws][alb][target_status_code]:int}) %{INT:[http][request][bytes]:int} %{INT:[http][response][bytes]:int} "(?:%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} (?:HTTP/%{NUMBER:[http][version]}|-)|%{DATA})" "%{DATA:[user_agent][original]}" %{NOTSPACE:[tls][cipher]} %{NOTSPACE:[tls][version]} %{NOTSPACE:[aws][alb][target_group_arn]} "%{DATA:[http][request][id]}" "%{DATA:[url][domain]}" "%{DATA:[aws][alb][chosen_cert_arn]}" %{NOTSPACE:[aws][alb][matched_rule_priority]} %{NOTSPACE:[aws][alb][request_creation_time]} "%{DATA:[aws][alb][actions_executed]}" "%{DATA:[aws][alb][redirect_url]}" "%{DATA:[aws][alb][error_reason]}" "%{DATA:[aws][alb][target_port_list]}" "%{DATA:[aws][alb][target_status_code_list]}" "%{DATA:[aws][alb][classification]}" "%{DATA:[aws][alb][classification_reason]}"(?: %{NOTSPACE:[aws][alb][conn_trace_id]})?(?: .*)?$'
      }
      pattern_definitions => {
        "ALB_TYPE" => "[a-z0-9]+"
        "ALB_SECS" => "-?[0-9.]+"
      }
    }
    # 응답을 보낸 시각
    date { match => ["[@metadata][alb][time]", "ISO8601"] }
    # '-' 값 정리, 처리 시간 합 → event.duration, URL 나누기, TLS 버전, 응답 코드로 log.level
    ruby { path => "/usr/share/logstash/pipelines/aws-alb.rb" }
    mutate { add_field => { "[@metadata][dataset]" => "aws.alb" "[@metadata][service]" => "alb" } }

  } else if [@metadata][source] == "cloudfront" {
    # CloudFront 표준 로그 v2, JSON 출력 형식. 한 줄에 요청 하나이고 키는 문서의 필드 이름(c-ip, cs-uri-stem ...)이다.
    # 필드를 그대로 펼치지 않고 aws-cloudfront.rb가 ECS 필드로 옮긴다(cs(Cookie)는 버린다).
    json {
      source => "message"
      target => "[@metadata][cf]"
    }
    if [@metadata][cf] {
      ruby { path => "/usr/share/logstash/pipelines/aws-cloudfront.rb" }
    }
    mutate { add_field => { "[@metadata][dataset]" => "aws.cloudfront" "[@metadata][service]" => "cloudfront" } }

  } else if [@metadata][source] == "rds" {
    # PostgreSQL 로그 한 줄(CloudWatch 이벤트 하나). 접두어 두 가지를 받는다(8절).
    #   새 접두어 %m:%r:%u@%d:[%p]:%l:%e:%s:%v:%x:%c:%q%a:  (사용자 정의 파라미터 그룹을 붙인 뒤)
    #     2026-10-31 10:00:00.123 UTC:10.20.13.5(51234):content_svc@content:[1234]:5:40P01:2026-10-31 09:59:00 UTC:3/1234:0:6720a1b2.4d2:PostgreSQL JDBC Driver:ERROR:  deadlock detected
    #     백그라운드 프로세스는 %q에서 끊겨 응용 이름 칸이 없다.
    #   기본 접두어 %t:%r:%u@%d:[%p]:  (그룹을 바꾸기 전)
    #     2026-10-31 10:00:00 UTC:10.20.13.5(51234):content_svc@content:[1234]:LOG:  connection authorized: ...
    grok {
      match => {
        "message" => [
          "(?m)^%{PG_TS:[@metadata][pg][time]}:%{PG_REMOTE}:%{PG_NAME:[postgresql][log][user]}?@%{PG_NAME:[postgresql][log][database]}?:\[%{INT:[process][pid]:int}\]:%{INT:[postgresql][log][session_line_num]:int}?:%{PG_SQLSTATE:[@metadata][pg][sqlstate]}?:%{PG_TS:[postgresql][log][session_start_time]}?:%{PG_VXID:[postgresql][log][virtual_transaction_id]}?:%{PG_XID:[postgresql][log][transaction_id]}?:%{PG_SESSION:[postgresql][log][session_id]}?:(?:%{PG_APP:[postgresql][log][application_name]}:)?%{PG_SEVERITY:[@metadata][pg][severity]}:\s+%{GREEDYDATA:message}",
          "(?m)^%{PG_TS:[@metadata][pg][time]}:%{PG_REMOTE}:%{PG_NAME:[postgresql][log][user]}?@%{PG_NAME:[postgresql][log][database]}?:\[%{INT:[process][pid]:int}\]:%{PG_SEVERITY:[@metadata][pg][severity]}:\s+%{GREEDYDATA:message}"
        ]
      }
      pattern_definitions => {
        "PG_TS" => "\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)? [A-Z]{2,5}"
        "PG_REMOTE" => "(?:%{IP:[source][ip]}\(%{INT:[source][port]:int}\)|\[local\])?"
        "PG_NAME" => "[A-Za-z0-9_.\-]+"
        "PG_SQLSTATE" => "[0-9A-Z]{5}"
        "PG_VXID" => "-?\d+/-?\d+"
        "PG_XID" => "\d+"
        "PG_SESSION" => "[0-9a-f]+\.[0-9a-f]+"
        "PG_APP" => "[^:\n]*"
        "PG_SEVERITY" => "DEBUG[1-5]|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC|DETAIL|HINT|QUERY|CONTEXT|LOCATION|STATEMENT"
      }
      overwrite => ["message"]
      add_field => { "[event][original]" => "%{[@metadata][original]}" }
    }
    # 서버 시각(UTC). 밀리초가 있으면(%m) 그대로 쓴다.
    date {
      match => ["[@metadata][pg][time]", "yyyy-MM-dd HH:mm:ss.SSS 'UTC'", "yyyy-MM-dd HH:mm:ss 'UTC'"]
      timezone => "UTC"
    }
    # AWS 내부 관리 계정의 연결·해제 줄은 버린다(4절 소음 제거).
    if [postgresql][log][user] == "rdsadmin" and [message] =~ /^(connection (received|authenticated|authorized)|disconnection)/ {
      drop {}
    }
    # 심각도 → log.level. DETAIL·HINT·STATEMENT 같은 보조 줄은 앞 줄을 설명하는 것이라 info로 둔다.
    mutate { lowercase => ["[@metadata][pg][severity]"] }
    translate {
      source => "[@metadata][pg][severity]"
      target => "[log][level]"
      fallback => "unknown"
      dictionary => {
        "debug1" => "debug"
        "debug2" => "debug"
        "debug3" => "debug"
        "debug4" => "debug"
        "debug5" => "debug"
        "log" => "info"
        "info" => "info"
        "notice" => "info"
        "warning" => "warn"
        "error" => "error"
        "fatal" => "fatal"
        "panic" => "fatal"
        "detail" => "info"
        "hint" => "info"
        "query" => "info"
        "context" => "info"
        "location" => "info"
        "statement" => "info"
      }
    }
    # 느린 쿼리(log_min_duration_statement)와 잠금 대기(log_lock_waits)는 LOG 심각도로 남지만 warn으로 올린다.
    if [message] =~ /^duration: [0-9.]+ ms/ {
      grok {
        match => { "message" => "^duration: %{NUMBER:[@metadata][pg][duration_ms]:float} ms" }
        tag_on_failure => []
      }
      ruby { code => 'ms = event.get("[@metadata][pg][duration_ms]"); event.set("[event][duration]", (ms * 1_000_000).round) if ms' }
      mutate { replace => { "[log][level]" => "warn" } }
    } else if [message] =~ /still waiting for .*Lock/ {
      mutate { replace => { "[log][level]" => "warn" } }
    }
    # SQLSTATE: 00000(성공)이 아니면 error.code, 알려진 충돌·동시성 코드는 조건 이름을 error.type에(8절 표).
    if [@metadata][pg][sqlstate] and [@metadata][pg][sqlstate] != "00000" {
      mutate { copy => { "[@metadata][pg][sqlstate]" => "[error][code]" } }
      translate {
        source => "[error][code]"
        target => "[error][type]"
        dictionary => {
          "40001" => "serialization_failure"
          "40P01" => "deadlock_detected"
          "23505" => "unique_violation"
          "23503" => "foreign_key_violation"
          "55P03" => "lock_not_available"
          "57014" => "query_canceled"
          "57P01" => "admin_shutdown"
        }
      }
    }
    mutate { add_field => { "[@metadata][dataset]" => "aws.rds" "[@metadata][service]" => "rds-postgresql" } }

  } else if [@metadata][source] == "neptune" {
    # slowquery 로그 JSON 하나. 쿼리 원문은 저장하지 않는다. aws-neptune.rb가 Gremlin 리터럴 값을 지운 쿼리만 message에 둔다.
    # 원문 JSON에 쿼리가 그대로 있으므로 event.original도 만들지 않는다.
    json {
      source => "message"
      target => "[@metadata][np]"
    }
    if [@metadata][np] {
      ruby { path => "/usr/share/logstash/pipelines/aws-neptune.rb" }
    }
    mutate { add_field => { "[@metadata][dataset]" => "aws.neptune" "[@metadata][service]" => "neptune" } }

  } else if [@metadata][source] == "eks_authenticator" {
    # aws-iam-authenticator logfmt 줄: time="..." level=info msg="access granted" arn="..." username="..." ...
    kv {
      source => "message"
      target => "[@metadata][kv]"
      add_field => { "[event][original]" => "%{[@metadata][original]}" }
    }
    if [@metadata][kv][msg] {
      mutate { replace => { "message" => "%{[@metadata][kv][msg]}" } }
    }
    if [@metadata][kv][arn] {
      mutate { copy => { "[@metadata][kv][arn]" => "[aws][eks][authenticator][arn]" } }
    }
    if [@metadata][kv][username] {
      mutate { copy => { "[@metadata][kv][username]" => "[aws][eks][authenticator][username]" } }
    }
    if [@metadata][kv][time] {
      date { match => ["[@metadata][kv][time]", "ISO8601"] }
    }
    mutate { lowercase => ["[@metadata][kv][level]"] }
    translate {
      source => "[@metadata][kv][level]"
      target => "[log][level]"
      fallback => "unknown"
      dictionary => {
        "debug" => "debug"
        "info" => "info"
        "warning" => "warn"
        "warn" => "warn"
        "error" => "error"
        "fatal" => "fatal"
        "panic" => "fatal"
      }
    }
    mutate { add_field => { "[@metadata][dataset]" => "aws.eks_authenticator" "[@metadata][service]" => "eks" } }

  } else {
    # 출처를 알 수 없는 줄(설정 실수, 켜지 않은 EKS 로그 종류). 버리지 않고 따로 모아 규칙을 더할 수 있게 한다.
    mutate { add_field => { "[@metadata][dataset]" => "aws.unknown" "[@metadata][service]" => "aws" } }
  }

  if ![log][level] {
    mutate { add_field => { "[log][level]" => "unknown" } }
  }

  # ---------------------------------------------------------------- 3. 마스킹
  ruby {
    path => "/usr/share/logstash/pipelines/mask.rb"
  }

  # ---------------------------------------------------------------- 4. 공통 필드
  # ES output이 이 세 값으로 data stream logs-aws.<출처>-<env>를 고른다. 다른 mutate가 실패해도 보관함은 맞게 가도록 따로 둔다.
  mutate {
    replace => {
      "[data_stream][type]" => "logs"
      "[data_stream][dataset]" => "%{[@metadata][dataset]}"
      "[data_stream][namespace]" => "${ENVIRONMENT}"
    }
  }
  mutate {
    replace => {
      "[event][dataset]" => "%{[@metadata][dataset]}"
      "[service][name]" => "%{[@metadata][service]}"
      "[service][environment]" => "${ENVIRONMENT}"
      "[cloud][provider]" => "aws"
      "[ecs][version]" => "8.11"
    }
  }
}
