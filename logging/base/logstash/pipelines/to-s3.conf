# to-s3 pipeline: 가공·마스킹이 끝난 이벤트를 S3 보관 버킷에 남긴다. 버킷 lifecycle이 365일 뒤 지운다.
# ES(30일)보다 오래된 로그를 찾을 때의 원본이다. ES 쪽과 달리 길이 상한(256KB)으로 자르지 않은 전문을 둔다.
# 이 pipeline에도 디스크 큐(persisted)가 있어 S3가 잠시 막혀도 이벤트가 큐에 쌓였다가 올라가고, to-es는 계속된다.
input {
  pipeline {
    address => "to-s3"
  }
}

output {
  s3 {
    # 자격 증명은 EKS Pod Identity(monitoring/logstash → lore-sentry[-dev]-logstash-role)에서 받는다. 키를 두지 않는다.
    region => "ap-northeast-2"
    bucket => "${ARCHIVE_BUCKET}"

    # <환경>/YYYY/MM/DD/ 아래에 파일을 둔다. 날짜는 이벤트 @timestamp(UTC) 기준이다.
    prefix => "${ENVIRONMENT}/%{+YYYY}/%{+MM}/%{+dd}/"

    # 한 줄에 이벤트 하나(JSON)를 쓰고 gzip으로 묶는다. zcat·jq·Athena로 바로 읽을 수 있다.
    codec => json_lines
    encoding => "gzip"

    # S3는 이어 쓰기가 안 되므로 로컬 파일에 모았다가 통째로 올린다. 60분 또는 100MB 중 먼저 오는 때에 올린다.
    # 지금은 dev 업로드·차단 시험을 위해 잠시 5분이다. 시험이 끝나면 60으로 되돌린다.
    rotation_strategy => "size_and_time"
    time_file => 5
    size_file => 104857600

    # 모으는 중인 파일은 logstash-data PVC에 둔다. 파드가 재시작해도 남고, restore가 시작할 때 먼저 올린다.
    temporary_directory => "/usr/share/logstash/data/s3-archive"
    restore => true

    # 버킷은 ACL이 꺼져 있어(BucketOwnerEnforced) ACL이 없거나 bucket-owner-full-control인 업로드만 받는다.
    # 이 출력은 ACL을 항상 붙이고 기본값(private)은 거부되므로 받아 주는 값으로 둔다.
    canned_acl => "bucket-owner-full-control"

    # 시작할 때 버킷 맨 위에 시험 파일을 올려 쓰기 권한을 확인한다. 역할에 삭제 권한이 없어 시험 파일은 남고
    # lifecycle이 365일 뒤 지운다. 권한이 틀리면 여기서 바로 실패해 원인이 로그에 드러난다.
    validate_credentials_on_root_bucket => true
  }
}
