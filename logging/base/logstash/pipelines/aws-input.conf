# aws pipeline 입력: aws-logs Filebeat(1대)가 S3 원천 버킷과 CloudWatch 로그 그룹에서 읽어 보내는 AWS 관리형 로그를 받는다
# (Service logstash-ls-aws:5045). 파드 로그(app pipeline, 5044)와 형식이 전혀 달라 pipeline을 나눈다.
input {
  beats {
    port => 5045
    # 기본값은 모든 이벤트 tags에 beats_input_codec_plain_applied를 붙인다. 밑줄 없는 태그는 앱이 쓰는 칸이라 끈다.
    include_codec_tag => false
    # 보낼 것이 없는 연결을 끊기까지 기다리는 시간(초). 기본 60초면 1~2분에 한 번 보내는 aws-logs Filebeat가
    # 끊긴 연결에 쓰다 connection reset 오류를 내고 다시 붙는다. 클라이언트가 1대뿐이라 오래 잡아 둬도 된다.
    client_inactivity_timeout => 900
  }
}
