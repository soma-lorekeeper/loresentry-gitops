# to-es pipeline: 가공이 끝난 이벤트를 Elasticsearch data stream에 넣는다.
# 입력 pipeline(app, 이후 aws)이 보낸 이벤트를 받는다. 이 pipeline에는 디스크 큐(persisted)가 있어 ES가 잠시 멈춰도
# 이벤트가 큐에 쌓였다가 다시 들어가고, 다른 출력(이후 to-s3)은 영향을 받지 않는다.
input {
  pipeline {
    address => "to-es"
  }
}

filter {
  # ES 저장·검색 비용 대책(LOG_SCHEMA.md 4절 "길이 상한"). 256KB를 넘는 필드만 앞부분을 남기고 tags에 _truncated를 붙인다.
  # S3 보관본은 자르지 않으므로 이 pipeline에서만 한다.
  truncate {
    fields => ["message", "[error][stack_trace]", "[event][original]"]
    length_bytes => 262144
    add_tag => ["_truncated"]
  }
}

output {
  elasticsearch {
    # ECK가 elasticsearchRefs(clusterName: logs)로 넣어 주는 접속 정보. 계정은 ECK가 이 Logstash 전용으로 만든다.
    hosts => ["${LOGS_ES_HOSTS}"]
    user => "${LOGS_ES_USER}"
    password => "${LOGS_ES_PASSWORD}"
    ssl_certificate_authorities => "${LOGS_ES_SSL_CERTIFICATE_AUTHORITY}"
    # 이벤트의 data_stream.type·dataset·namespace로 logs-<dataset>-<env>에 넣는다. 처음 쓰는 이름이면 ES가 만든다.
    data_stream => "true"
  }
}
