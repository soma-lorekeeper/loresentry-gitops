# EDOT Collector gateway 설정. 서비스 6개가 OTLP로 보낸 span과 앱 지표를 받아 민감한 값을 지우고 ES에 쓴다.
# 흐름(span): otlp 수신 → memory_limiter → tail_sampling(빈 폴링·성공한 헬스체크·Redis 연결 handshake trace 버리기) → filter/genai-content(대화 내용 event 떼기)
#       → transform/privacy(지우기·가리기) → batch → elasticapm(APM 필드 보강) → ES
#       elasticapm connector가 span으로 서비스·트랜잭션 집계 지표를 만들어 같은 ES에 쓴다(Kibana APM 화면이 읽는다).
# 흐름(앱 지표): otlp 수신 → memory_limiter → filter/metric-noise(쓰지 않는 계열 버리기) → transform/metric-privacy → batch/metrics → ES
#       metrics-*.otel-*에 쌓여 Kibana APM 서비스의 Metrics 탭·앱 지표 대시보드와 Grafana 앱 경보(loresentry-app)가 읽는다.
# 규칙은 docs 저장소 LOG_SCHEMA.md 4절 "trace 마스킹"과 같다. 바꾸면 그 문서도 같은 시점에 고친다.
# 이 파일 안에서 `$`는 환경 변수 치환 표시라, 정규식 치환의 `${1}`은 `$${1}`로 적는다.

extensions:
  # Kubernetes readiness·liveness probe가 부르는 주소.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # 앱은 OTLP로 span과 앱 지표(JVM·런타임·HTTP·DB 풀·우리 지표)를 보낸다. 로그는 Filebeat → Logstash가 따로 모은다.
  # 지표는 dev overlay가 OTEL_METRICS_EXPORTER=otlp로 켠 환경에서만 온다(docs ALERTING.md 7절).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # span에서 Kibana APM용 집계 지표(서비스·트랜잭션·호출 대상, 1분·10분·60분)를 만든다.
  elasticapm: {}

processors:
  # 메모리가 한도(컨테이너 한도의 80%)에 가까워지면 받기를 잠시 거절해 OOM으로 죽지 않게 한다.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # 로그가 남기지 않는 trace를 통째로 버린다(LOG_SCHEMA.md 7절). 버리는 것은 두 가지다.
  #   - 빈 폴링 회차: 앱(content·auth의 LogFlow.polling, ai-chat summarizer tick)은 할 일이 없던 회차의 span에
  #     loresentry.polling.idle=true를 단다. 로그가 빈 회차에 줄을 남기지 않는 것과 맞추는 것이다.
  #   - 성공한 헬스체크: kubelet probe와 ALB health check가 서비스마다 분당 수십 번 부른다(2026-11-04 하루 약 10만 trace).
  #     성공 여부는 Prometheus와 파드 이벤트가 이미 기록하고, 로그도 성공한 헬스체크의 info 줄을 버린다(LOG_SCHEMA.md 4절).
  # span 하나만 거르면 그 아래의 자식 span(ai-chat 대기열 조회, graph-rag ASGI span)이 부모 없이 남으므로, trace 단위로 모아 정하는 tail_sampling을 쓴다.
  # 한 trace의 span을 decision_wait 동안 모았다가 정하므로 ES 반영이 그만큼 늦다. 그 뒤에 늦게 온 span(같은 trace의 다른 서비스)은
  # 새 trace처럼 다시 판단되어, 표시가 없으면 남는다. 표시가 없는 trace는 모두 남긴다(표본 추출은 하지 않는다).
  tail_sampling:
    decision_wait: 5s
    # 판단을 기다리며 메모리에 둘 trace 수. dev 트래픽(초당 수십 trace)의 수십 배라 넉넉하다
    num_traces: 20000
    expected_new_traces_per_sec: 50
    policies:
      - name: drop-idle-polling
        type: drop
        drop:
          drop_sub_policy:
            - name: idle-polling-span
              type: boolean_attribute
              boolean_attribute:
                key: loresentry.polling.idle
                value: true
      # 헬스체크 요청을 처음 받은 서비스의 span(root, 부모 없는 span)만 본다. 그 응답이 400 미만이면 trace를 버리고,
      # 실패(503 등)면 아래 자식 span이 성공했어도 trace를 남긴다. 실패한 헬스체크는 로그(warn·error 줄)도 남는다.
      # 조건 세 줄은 속성 이름만 다르고, 어느 하나라도 맞으면 버린다.
      #   1. OpenTelemetry 안정 이름(EDOT Java agent·Python distro): url.path, http.response.status_code(정수)
      #   2. Python 계측 옛 이름(EDOT로 옮기기 전 ai-chat·graph-rag): http.target, http.status_code(정수)
      #   3. Micrometer 이름(EDOT로 옮기기 전 Java 서비스): uri, status(문자열)
      # 속성이 없으면 IsMatch는 false, 정수 비교도 false라 그 줄은 맞지 않는다. 정규식 끝의 `$$`는 이 파일의 `$` 표기다.
      - name: drop-successful-health-check
        type: drop
        drop:
          drop_sub_policy:
            - name: successful-health-check-root
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and IsMatch(attributes["url.path"], "^/health(/.*)?$$") and attributes["http.response.status_code"] < 400'
                  - 'IsRootSpan() and IsMatch(attributes["http.target"], "^/health(/.*)?$$") and attributes["http.status_code"] < 400'
                  - 'IsRootSpan() and IsMatch(attributes["uri"], "^/health(/.*)?$$") and IsMatch(attributes["status"], "^[123][0-9][0-9]$$")'
      # Redis 연결 handshake. Lettuce는 연결을 열 때 event loop 스레드에서 AUTH·HELLO·CLIENT SETINFO·CLIENT MAINT_NOTIFICATIONS·SELECT를
      # 보낸다. 부르는 쪽 문맥 밖이라 부모 없는 CLIENT span 하나짜리 trace가 되고, 흐름이 아니다(LOG_SCHEMA.md 7절 "흐름 밖 DB 쿼리").
      # gateway는 세션을 확인할 때마다 연결을 새로 열어 인증된 요청 하나마다 이런 trace가 4개쯤 생기고, Valkey가 모르는 명령(MAINT_NOTIFICATIONS)은
      # ERROR가 되어 APM 오류율·목록을 덮는다. 로그도 handshake를 남기지 않으므로 버린다. 흐름 안의 Redis 명령(GET, EVAL 등)은 부르는 쪽 span을
      # 부모로 가져 root가 아니므로 걸리지 않는다. 연결이 실패하면 그것을 부른 쪽의 `valkey call`·`redis call` span과 결과 줄이 남는다.
      - name: drop-redis-connection-handshake
        type: drop
        drop:
          drop_sub_policy:
            - name: redis-handshake-root
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and kind == SPAN_KIND_CLIENT and (attributes["db.system.name"] == "redis" or attributes["db.system"] == "redis") and IsMatch(name, "^(AUTH|HELLO|CLIENT|SELECT)( |$$)")'
      - name: keep-everything-else
        type: always_sample

  # GenAI 대화 내용 event(gen_ai.user.message, gen_ai.choice 등 이름이 gen_ai.로 시작하는 span event)를 span에서 떼어 낸다.
  # 프롬프트와 모델 응답은 작품 데이터다. 앱은 내용 기록을 꺼 두므로(OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=false)
  # 평소에는 걸리는 것이 없다. 설정이 잘못 켜졌을 때의 두 번째 방어선이다. 모델 이름·토큰 수는 span 속성이라 남는다.
  filter/genai-content:
    error_mode: ignore
    traces:
      spanevent:
        - 'IsMatch(name, "^gen_ai\\.")'

  # 민감한 값 처리. 로그와 같은 원칙: 쿼리스트링(검색어 등), 예외 메시지, SQL, S3 객체 키, GenAI 대화 내용은 아예 남기지 않는다.
  # 지운 뒤 남은 모든 문자열 속성에 Logstash mask.rb와 같은 정규식을 한 번 더 건다(두 번째 방어선).
  # 정규식은 Go RE2라 lookahead가 없다. 그래서 이메일 규칙은 클러스터 안 주소(…@….svc)도 가리고,
  # DB 키 값 규칙은 괄호 안을 통째로 가린다. 속성이 없으면 각 문장은 아무것도 하지 않는다.
  transform/privacy:
    error_mode: ignore
    trace_statements:
      # span 속성. context를 나눠 적는다(섞으면 spanevent로 추론되어 event 없는 span이 처리되지 않는다).
      - context: span
        statements:
          # URL은 쿼리를 뗀 경로까지만 남긴다. 새 semconv(url.*)와 옛 semconv(http.*)를 모두 덮는다.
          - 'replace_pattern(span.attributes["url.full"], "\\?.*", "")'
          - 'replace_pattern(span.attributes["url.original"], "\\?.*", "")'
          - 'replace_pattern(span.attributes["http.url"], "\\?.*", "")'
          - 'replace_pattern(span.attributes["http.target"], "\\?.*", "")'
          - 'delete_key(span.attributes, "url.query")'
          # SQL 문. 값이 바인딩되어 있어도 로그 규약상 SQL은 남기지 않는다(느린 쿼리는 RDS 로그로 본다).
          - 'delete_key(span.attributes, "db.statement")'
          - 'delete_key(span.attributes, "db.query.text")'
          # AWS 호출 span(S3·KMS)의 주소에는 S3 객체 키가 들어 있다. 이미지 키는 공개 주소(CloudFront) 뒤에 붙이면 누구나 열 수 있어
          # 키가 곧 열람 권한이다. AWS SDK 계측 span(rpc.system aws-api)과, HTTP 계측이 S3 주소를 직접 부른 span의 주소를 지운다.
          # bucket·작업 이름(rpc.service·rpc.method)·상태·걸린 시간은 남는다.
          - 'delete_key(span.attributes, "url.full") where span.attributes["rpc.system"] == "aws-api" or IsMatch(span.attributes["server.address"], "(^|\\.)s3[.-]")'
          - 'delete_key(span.attributes, "url.path") where span.attributes["rpc.system"] == "aws-api" or IsMatch(span.attributes["server.address"], "(^|\\.)s3[.-]")'
          - 'delete_key(span.attributes, "http.url") where span.attributes["rpc.system"] == "aws-api" or IsMatch(span.attributes["server.address"], "(^|\\.)s3[.-]")'
          - 'delete_key(span.attributes, "http.target") where span.attributes["rpc.system"] == "aws-api" or IsMatch(span.attributes["server.address"], "(^|\\.)s3[.-]")'
          - 'delete_key(span.attributes, "aws.s3.key")'
          - 'delete_key(span.attributes, "aws.s3.copy_source")'
          # span 상태 메시지. 계측 라이브러리는 예외로 끝난 span에 예외 문자열을 넣는다(Python SDK는 "<종류>: <메시지>", botocore는
          # AWS 오류 메시지). DB 오류 메시지에는 키 값(Key (col)=(value))이 들어갈 수 있어 예외 메시지처럼 지운다. 상태 코드(ERROR)는
          # 남는다. 로깅 팩토리가 연 span(Java com.loresentry.<서비스>.logging, Python app.logs)의 메시지는 우리 이유 코드(error.type)라 남긴다.
          - 'set(span.status.message, "") where not IsMatch(instrumentation_scope.name, "^(com\\.loresentry\\.[a-z_]+\\.logging|app\\.logs)$$")'
          # GenAI 대화 내용 속성: 프롬프트·응답(옛 이름 gen_ai.prompt.0.content 같은 번호 붙은 키 포함), 입력·출력 메시지,
          # 시스템 지시, 도구 호출 인자·결과. 모델 이름(gen_ai.request.model)과 토큰 수(gen_ai.usage.*)는 남는다.
          - 'delete_matching_keys(span.attributes, "^gen_ai\\.((prompt|completion)(\\..*)?|input\\.messages|output\\.messages|system_instructions|tool\\.call\\.(arguments|result))$$")'
          # 남은 문자열 속성 전체에 정규식 가리기.
          - 'replace_all_patterns(span.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "[email]")'
          - 'replace_all_patterns(span.attributes, "value", "(^|[?&\"])(code|state|gclid|gbraid|wbraid)=[^&\\s\"''#]+", "$${1}$${2}=[redacted]")'
          - 'replace_all_patterns(span.attributes, "value", "(?i)(^|[?&\"])(X-Amz-Signature|X-Amz-Credential|X-Amz-Security-Token|Signature)=[^&\\s\"''#]+", "$${1}$${2}=[redacted]")'
          - 'replace_all_patterns(span.attributes, "value", "((?:__Host-)?ls_(?:session|consent)=)[^;\\s\"'',]+", "$${1}[redacted]")'
          - 'replace_all_patterns(span.attributes, "value", "(?i)\\b((?:set-)?cookie|authorization)([\"'']?\\s*:\\s*)[^\\r\\n]+", "$${1}$${2}[redacted]")'
          - 'replace_all_patterns(span.attributes, "value", "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]*", "[jwt]")'
          - 'replace_all_patterns(span.attributes, "value", "(?i)(PASSWORD\\s+)''(?:[^'']|'''')*''", "$${1}''[redacted]''")'
          - 'replace_all_patterns(span.attributes, "value", "(Key \\([^)]*\\)=\\()[^)]*(\\))", "$${1}[redacted]$${2}")'
      # span event 속성. 예외 event는 ES에서 logs-*.otel-* 문서(APM 오류)가 된다.
      # 메시지와 스택(Caused by 줄에 메시지가 있다)은 지우고 exception.type만 남긴다. 스택은 trace.id로 앱 로그에서 본다.
      - context: spanevent
        statements:
          - 'delete_key(spanevent.attributes, "exception.message")'
          - 'delete_key(spanevent.attributes, "exception.stacktrace")'
          - 'replace_all_patterns(spanevent.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "[email]")'
          - 'replace_all_patterns(spanevent.attributes, "value", "(^|[?&\"])(code|state|gclid|gbraid|wbraid)=[^&\\s\"''#]+", "$${1}$${2}=[redacted]")'
          - 'replace_all_patterns(spanevent.attributes, "value", "(?i)(^|[?&\"])(X-Amz-Signature|X-Amz-Credential|X-Amz-Security-Token|Signature)=[^&\\s\"''#]+", "$${1}$${2}=[redacted]")'
          - 'replace_all_patterns(spanevent.attributes, "value", "((?:__Host-)?ls_(?:session|consent)=)[^;\\s\"'',]+", "$${1}[redacted]")'
          - 'replace_all_patterns(spanevent.attributes, "value", "(?i)\\b((?:set-)?cookie|authorization)([\"'']?\\s*:\\s*)[^\\r\\n]+", "$${1}$${2}[redacted]")'
          - 'replace_all_patterns(spanevent.attributes, "value", "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]*", "[jwt]")'
          - 'replace_all_patterns(spanevent.attributes, "value", "(?i)(PASSWORD\\s+)''(?:[^'']|'''')*''", "$${1}''[redacted]''")'
          - 'replace_all_patterns(spanevent.attributes, "value", "(Key \\([^)]*\\)=\\()[^)]*(\\))", "$${1}[redacted]$${2}")'

  # ES에 묶어 보낸다(Elastic 공식 gateway 예시 값).
  batch:
    send_batch_size: 1000
    send_batch_max_size: 1500
    timeout: 1s

  # span에 Kibana APM이 쓰는 필드(transaction·span 구분, 이름 등)를 더한다. 집계 connector보다 앞에 있어야 한다.
  elasticapm: {}

  # 앱 지표 중 화면·경보 어디에서도 보지 않는 계열을 버린다.
  #   - HTTP 요청·응답 본문 크기 histogram: Java(실험 HTTP 지표)·Python 계측이 지연 histogram과 함께 경로·상태 코드별로 내서,
  #     남기면 저장 공간만 지연 histogram만큼 더 쓴다.
  #   - Kafka 클라이언트 지표: Java kafka-clients 계측이 Kafka client의 내부 지표 90여 종을 그대로 옮긴다(2026-11-05 dev에서 content
  #     혼자 10분에 문서 258개, JVM 지표의 약 4배). 발행·가져오기 지연과 밀림·발행 오류만 남긴다. 소비 밀림 건수는 Prometheus(Kafka
  #     exporter)에도 있고, 메시지가 늦게 처리된 시간은 앱의 loresentry.kafka.consume.delay가 잰다.
  #   - Python psycopg 계측의 DB 명령 지연(db.client.operation.duration): 계측이 버킷 경계를 정하지 않아 SDK 기본 경계(0, 5, 10, 25 …
  #     ms용)를 쓴다. 값은 초라 거의 모든 명령(2~4ms)이 첫 칸(0~5)에 들어가 p95가 늘 2.5로 나온다(2026-11-05 dev). 지연을 계산할 수
  #     없으므로 버린다. ai-chat의 DB 지연은 span으로 만든 APM 집계(metrics-service_destination, Kibana Dependencies)로 본다.
  #     Java JDBC 계측의 같은 이름 지표는 경계가 맞아 남긴다(scope 이름으로 가린다).
  filter/metric-noise:
    error_mode: ignore
    metrics:
      metric:
        - 'IsMatch(name, "^http\\.(server|client)\\.(request|response)\\.body\\.size$$")'
        - 'IsMatch(name, "^kafka\\.(consumer|producer)\\.") and not IsMatch(name, "^kafka\\.(consumer\\.(fetch_latency_avg|records_lag_max)|producer\\.(request_latency_avg|record_error_rate))$$")'
        - 'name == "db.client.operation.duration" and instrumentation_scope.name == "opentelemetry.instrumentation.psycopg"'

  # 앱 지표 datapoint 속성의 두 번째 방어선. 계측은 경로 템플릿(http.route)과 대상 주소(server.address)만 담고 실제 경로·
  # 쿼리스트링은 담지 않는다(2026-11-05 EDOT Java 1.14.0·Python 1.19.0 로컬 확인). 담기는 일이 생기면 여기서 지우고,
  # 남은 문자열 속성(우리 지표의 topic 이름 등)에 든 이메일은 span과 같은 규칙으로 가린다.
  transform/metric-privacy:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - 'delete_key(datapoint.attributes, "url.full")'
          - 'delete_key(datapoint.attributes, "url.path")'
          - 'delete_key(datapoint.attributes, "url.query")'
          - 'delete_key(datapoint.attributes, "http.target")'
          - 'delete_key(datapoint.attributes, "http.url")'
          - 'replace_all_patterns(datapoint.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "[email]")'

  # 앱 지표는 요청 하나를 쪼개지 않고 그대로 묶어 보낸다(Elastic 공식 gateway 예시 값. 쪼개면 같은 시각의 계열이 여러 요청으로 나뉜다).
  batch/metrics:
    send_batch_max_size: 0
    timeout: 1s

exporters:
  elasticsearch/otel:
    endpoints: ["https://logs-es-http.monitoring.svc:9200"]
    # bootstrap/dev/09-apm-key.sh가 만든 쓰기 전용 API key(Secret edot-collector-es). 권한은 *.otel-* data stream 쓰기만.
    api_key: ${env:ELASTIC_API_KEY}
    tls:
      # ECK가 만든 ES HTTPS 인증서의 CA(Secret logs-es-http-certs-public).
      ca_file: /etc/es-ca/ca.crt
    # OTel 원래 모양 그대로 traces-*.otel-*, metrics-*.otel-*, logs-*.otel-*에 쓴다(Kibana APM이 읽는 모양).
    mapping:
      mode: otel

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, filter/genai-content, transform/privacy, batch, elasticapm]
      exporters: [elasticapm, elasticsearch/otel]
    # 앱 지표. 앱이 보낸 값을 그대로 쓰고(Java·Python SDK가 delta로 보내 cumulativetodelta는 필요 없다), 쓰지 않는 계열만 거른다.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/metric-noise, transform/metric-privacy, batch/metrics]
      exporters: [elasticsearch/otel]
    # connector가 만든 집계 지표. 이미 계산된 값이라 다른 processor를 거치지 않는다.
    metrics/aggregated-otel-metrics:
      receivers: [elasticapm]
      processors: []
      exporters: [elasticsearch/otel]
