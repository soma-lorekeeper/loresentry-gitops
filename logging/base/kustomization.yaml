apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 로깅 스택은 클러스터마다 한 벌이고 모두 monitoring에 둔다(overlay가 namespace를 바꾸지 않는다).
namespace: monitoring

resources:
  - elasticsearch/elasticsearch.yaml
  - elasticsearch/template-job.yaml
  - kibana/kibana.yaml
  - logstash/serviceaccount.yaml
  - logstash/logstash.yaml
  - filebeat/rbac.yaml
  - filebeat/filebeat.yaml
  - filebeat-aws/serviceaccount.yaml
  - filebeat-aws/pvc.yaml
  - filebeat-aws/filebeat-aws.yaml
  - otel-collector/collector.yaml

# 파일을 ConfigMap으로 만든다. 이름 끝에 내용 해시가 붙어, 내용이 바뀌면 참조하는 Job·Logstash·collector가 새로 뜬다.
configMapGenerator:
  # component template(logs@custom, traces-otel@custom, metrics-otel@custom). template-job.yaml이 ES에 넣는다.
  - name: logs-custom-template
    files:
      - elasticsearch/logs-custom.json
      - elasticsearch/traces-otel-custom.json
      - elasticsearch/metrics-otel-custom.json
  # EDOT Collector 설정. otel-collector/collector.yaml이 /etc/edot에 붙인다.
  - name: edot-collector-config
    files:
      - otel-collector/otel.yml
  # Logstash pipeline 설정. logstash.yaml이 /usr/share/logstash/pipelines에 붙인다.
  - name: logstash-pipelines
    files:
      - logstash/pipelines/app-input.conf
      - logstash/pipelines/app-filter.conf
      - logstash/pipelines/app-output.conf
      - logstash/pipelines/aws-input.conf
      - logstash/pipelines/aws-filter.conf
      - logstash/pipelines/aws-output.conf
      - logstash/pipelines/aws-alb.rb
      - logstash/pipelines/aws-cloudfront.rb
      - logstash/pipelines/aws-neptune.rb
      - logstash/pipelines/to-es.conf
      - logstash/pipelines/to-s3.conf
      - logstash/pipelines/mask.rb

# ES 사용자 정의 역할(grafana_reader 등). 비밀값이 없지만 ECK가 Secret으로만 받는다. 이름 끝 해시로 내용이 바뀌면
# ECK가 새 역할을 다시 읽는다(ES 재시작 없음).
secretGenerator:
  - name: logs-es-roles
    files:
      - elasticsearch/roles.yml

# Kustomize는 Logstash·Elasticsearch CR 안의 ConfigMap·Secret 참조를 모르므로 해시 붙은 이름으로 바꿀 자리를 알려 준다.
configurations:
  - kustomizeconfig.yaml
