# 로그 탐색 화면. ECK가 ES 접속 계정과 CA를 만들어 연결하고, 저장 객체 암호화 키도 자동으로 정한다.
# 만들어지는 것: Service kibana-kb-http(5601, HTTPS, 자체 서명 인증서). ALB Ingress는 overlay에 있다.
# 접속 주소(server.publicBaseUrl)는 환경마다 달라 overlay에서 정한다.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  annotations:
    # wave 2: ES와 index template이 준비된 뒤.
    argocd.argoproj.io/sync-wave: "2"
spec:
  version: 9.5.5
  count: 1
  elasticsearchRef:
    name: logs
  # 로그 스택 자신의 상태를 Stack Monitoring으로 남긴다(docs ALERTING.md §8). ECK가 파드마다 Metricbeat sidecar를 붙여
  # 이 구성요소의 상태 API를 10초마다 읽어 같은 ES(logs)의 .monitoring-*에 쓴다. Grafana 로그 스택 경보가 이것을 읽는다.
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: logs
  podTemplate:
    spec:
      nodeSelector:
        role: logging
      tolerations:
        - key: dedicated
          operator: Equal
          value: logging
          effect: NoSchedule
      containers:
        - name: kibana
          # 2026-11-04 RSS가 limit(1.5Gi)의 96%로 계속 붙어 있어 올렸다(ContainerMemoryNearLimit)
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            limits:
              memory: 2Gi
        # Stack Monitoring sidecar(spec.monitoring). ECK는 자원값을 넣지 않으므로 Elastic의 Metricbeat 참고 매니페스트 값을 쓴다
        - name: metricbeat
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              memory: 200Mi
