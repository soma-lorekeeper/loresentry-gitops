# Filebeat가 파드 로그에 kubernetes.* (namespace, 파드, 노드, label)를 붙이려고 Kubernetes API를 읽는 권한. 읽기만 한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  # 파드 목록·label, namespace label, 노드 이름
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # 파드를 만든 Deployment·CronJob 이름을 찾을 때 거치는 소유자
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    # ClusterRoleBinding은 namespace가 없는 리소스라 subject의 namespace를 직접 적는다.
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
