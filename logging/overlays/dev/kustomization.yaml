apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev 클러스터(lore-sentry-dev-k8s)의 로깅 스택. argocd-apps-dev/logging.yaml이 읽는다.
namespace: monitoring

resources:
  - ../../base
  - ingress.yaml

patches:
  # Kibana가 링크·리다이렉트에 쓰는 바깥 주소.
  - target:
      kind: Kibana
      name: kibana
    patch: |-
      - op: add
        path: /spec/config
        value:
          server.publicBaseUrl: https://kibana-dev.loresentry.com
  # Logstash pipeline이 data stream 이름(logs-<dataset>-dev)과 공통 필드, S3 보관 위치에 쓰는 값.
  - target:
      kind: Logstash
      name: logstash
    patch: |-
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: ENVIRONMENT
          value: dev
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: CLUSTER_NAME
          value: lore-sentry-dev-k8s
      # bootstrap/dev/04-storage-iam.sh가 만든 보관 버킷(1년). 이름의 숫자는 AWS 계정 ID다.
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: ARCHIVE_BUCKET
          value: loresentry-log-archive-dev-197179613039
  # aws-logs Filebeat가 읽는 원천. 모두 bootstrap/dev/04-storage-iam.sh가 만든 것이다(env.sh와 같은 이름).
  - target:
      kind: Beat
      name: filebeat-aws
    patch: |-
      - op: add
        path: /spec/deployment/podTemplate/spec/containers/0/env
        value:
          - name: AWS_REGION
            value: ap-northeast-2
          # ALB·CloudFront가 쓰는 원천 버킷(30일)
          - name: AWS_LOGS_BUCKET
            value: loresentry-aws-logs-dev-197179613039
          - name: RDS_LOG_GROUP
            value: /aws/rds/instance/lore-sentry-dev-postgres/postgresql
          - name: NEPTUNE_LOG_GROUP
            value: /aws/neptune/lore-sentry-dev-neptune/slowquery
          - name: EKS_LOG_GROUP
            value: /aws/eks/lore-sentry-dev-k8s/cluster
