# aws-load-balancer-controller Helm values
# chart: https://aws.github.io/eks-charts (aws-load-balancer-controller)
#
# TODO: 실제 클러스터 값으로 교체할 것
#   clusterName / region / vpcId / IRSA role ARN
clusterName: lore-sentry-production
region: ap-northeast-2
vpcId: vpc-REPLACE_ME

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    # IRSA: AWSLoadBalancerControllerIAMPolicy 가 붙은 역할
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/AmazonEKSLoadBalancerControllerRole

replicaCount: 2

enableServiceMutatorWebhook: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
