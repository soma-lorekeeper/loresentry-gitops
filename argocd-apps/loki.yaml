apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "7.3.0"
    helm:
      valuesObject:
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          schemaConfig:
            configs:
              - from: "2026-09-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: s3
            bucketNames:
              chunks: loresentry-logs-prod-197179613039
              ruler: loresentry-logs-prod-197179613039
            s3:
              region: ap-northeast-2

          limits_config:
            retention_period: 720h
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            max_query_lookback: 720h
            allow_structured_metadata: true
            volume_enabled: true
            ingestion_rate_mb: 8
            ingestion_burst_size_mb: 16

          compactor:
            retention_enabled: true
            delete_request_store: s3

          pattern_ingester:
            enabled: false

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          persistence:
            enabled: true
            storageClass: gp3
            size: 10Gi

        serviceAccount:
          create: true
          name: loki

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        gateway:
          enabled: false

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        lokiCanary:
          enabled: false
        test:
          enabled: false

        monitoring:
          serviceMonitor:
            enabled: true
          dashboards:
            enabled: false
          rules:
            enabled: true
            alerting: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
