# 인프라 경보 규칙. 규칙 이름·조건·severity·근거는 docs ALERTING.md §6.2와 1:1로 맞춘다.
#
# 라벨 규약(ALERTING.md §4):
# - 모든 규칙은 severity를 단다. namespace는 원래 지표의 값을 그대로 쓴다.
# - kube-state-metrics·kubelet·Argo CD 지표에는 수집기 Service 이름(kube-prometheus-stack-kube-state-metrics 등)이
#   service 라벨로 붙어 오므로, label_replace로 앱(워크로드) 이름을 service에 덮어쓴다. 그래야 Slack 첫 줄과 억제 규칙
#   (AppDeploymentUnavailable이 같은 namespace·service의 warning을 가림)이 앱 단위로 맞는다.
# - 파드의 워크로드(Deployment·StatefulSet·DaemonSet 이름)는 kps 기본 recording rule
#   namespace_workload_pod:kube_pod_owner:relabel에서 붙인다(값은 항상 1이라 곱해도 원래 값이 그대로다).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loresentry-infra
  labels:
    app.kubernetes.io/part-of: lore-sentry
spec:
  groups:
    - name: loresentry-infra
      rules:
        # 앱 Deployment에 준비된 파드가 하나도 없다. kps 기본 규칙(KubeDeploymentReplicasMismatch)은 15분 뒤에야 울려서
        # 2분으로 따로 둔다. 일부러 replicas를 0으로 줄인 경우(spec 0)는 뺀다.
        # 롤링 업데이트는 새 파드가 준비될 때까지 옛 파드를 남기므로 배포 중에는 울리지 않는다.
        - alert: AppDeploymentUnavailable
          expr: |
            label_replace(
              kube_deployment_status_replicas_available{deployment=~"gateway-api|content-api|authentication-api|ai-chat-api|ai-chat-summarizer|graph-rag-api"} == 0,
              "service", "$1", "deployment", "(.+)"
            )
            and on (namespace, deployment)
            kube_deployment_spec_replicas > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.deployment }}에 준비된 파드가 없어요."
            description: "{{ $labels.namespace }}/{{ $labels.deployment }}의 준비된 파드가 2분 넘게 0개예요. 이 서비스로 가는 요청이 모두 실패해요."

        # 컨테이너 메모리가 limit에 가깝다. working set은 파일 캐시까지 세서 ES처럼 캐시를 많이 쓰는 컨테이너가 늘 높게
        # 나오므로, 실제로 OOM을 부르는 RSS(익명 메모리)로 본다. 잠깐 오르는 것은 10분으로 거른다.
        - alert: ContainerMemoryNearLimit
          expr: |
            label_replace(
              (
                (
                  max by (namespace, pod, container) (container_memory_rss{container!="", image!=""})
                  / on (namespace, pod, container)
                  max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
                )
                * on (namespace, pod) group_left (workload)
                max by (namespace, pod, workload) (namespace_workload_pod:kube_pod_owner:relabel)
              ) > 0.9,
              "service", "$1", "workload", "(.+)"
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}의 {{ $labels.container }} 메모리가 limit의 {{ $value | humanizePercentage }}예요."
            description: "pod {{ $labels.pod }}. 파일 캐시를 뺀 RSS 기준이에요. 계속 오르면 OOMKilled로 재시작해요."

        # 컨테이너가 메모리 limit을 넘어 죽고 재시작했다. 이미 일어난 일이라 for 없이 바로 알리고, 10분 창이 지나면 해소된다.
        - alert: ContainerOOMKilled
          expr: |
            label_replace(
              (
                (increase(kube_pod_container_status_restarts_total[10m]) > 0)
                and on (namespace, pod, container)
                (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
              )
              * on (namespace, pod) group_left (workload)
              max by (namespace, pod, workload) (namespace_workload_pod:kube_pod_owner:relabel),
              "service", "$1", "workload", "(.+)"
            )
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}의 {{ $labels.container }}가 메모리 limit을 넘어 OOMKilled로 재시작했어요."
            description: "pod {{ $labels.pod }}. 메모리 limit을 올리거나 메모리를 많이 쓰는 원인을 찾아야 해요."

        # Argo CD Application이 Healthy·Progressing이 아니다(Degraded·Missing·Unknown). 배포 중 잠깐은 정상이라 15분을 둔다.
        - alert: ArgoCDAppUnhealthy
          expr: |
            label_replace(
              argocd_app_info{health_status!~"Healthy|Progressing"},
              "service", "$1", "name", "(.+)"
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD Application {{ $labels.name }}이 {{ $labels.health_status }} 상태예요."
            description: "Argo CD 화면에서 어느 리소스가 문제인지 확인하세요."

        # Argo CD Application이 오래 OutOfSync다. 자동 sync(selfHeal)가 켜져 있어 push 직후의 OutOfSync는 금방 풀리므로,
        # 30분 넘게 이어지면 sync가 실패하고 있다는 뜻이다. strimzi-kafka-operator는 CRD 표시 문제로 원래부터 OutOfSync라 뺀다.
        - alert: ArgoCDAppOutOfSync
          expr: |
            label_replace(
              argocd_app_info{sync_status="OutOfSync", name!="strimzi-kafka-operator"},
              "service", "$1", "name", "(.+)"
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD Application {{ $labels.name }}이 30분 넘게 OutOfSync예요."
            description: "자동 sync가 실패하고 있을 수 있어요. Argo CD 화면에서 sync 결과를 확인하세요."
