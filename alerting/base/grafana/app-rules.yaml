              field: metrics.loresentry.outbox.relay.last_run_age
            bucketAggs:
            - id: '10'
              type: terms
              field: resource.attributes.service.name
              settings:
                size: '50'
                order: desc
                orderBy: _term
                min_doc_count: '1'
            - id: '2'
              type: date_histogram
