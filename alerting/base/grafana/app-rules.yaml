          summary: '{{ index $labels "resource.attributes.service.name" }} outbox의 가장 오래된 미발행 행이 {{ printf "%.0f" $values.C.Value }}초, relay 마지막 회차가 {{ printf "%.0f" $values.D.Value }}초 전이에요.'
          description: 이벤트가 Kafka로 나가지 못해 다른 서비스가 바뀐 것을 모르고 있어요. 행이 오래됐으면 Kafka·발행 실패(relay 로그의 OUTBOX_SEND_FAILED), relay 마지막 회차가 오래됐으면 스케줄러가 멈춘 거예요. 기준은 둘 다 5분이에요.
