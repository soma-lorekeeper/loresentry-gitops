# 경보 규칙. 두 환경이 같이 쓰는 규칙만 둔다. 환경마다 다른 값은 overlays/ENV에서 바꾼다.
# 규약과 규칙 목록: docs 저장소 ALERTING.md, 구성과 흐름: ALERTING_ARCHITECTURE.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Prometheus 규칙(Prometheus Operator가 클러스터의 모든 PrometheusRule을 읽는다)
  - prometheus/infra.yaml
  # Grafana 경보 provisioning(Grafana sidecar가 label grafana_alert인 ConfigMap을 읽는다)
  - grafana/notifications.yaml
  # Grafana 로그 경보 규칙 12개(docs ALERTING.md §6.4)
  - grafana/log-rules.yaml
