apiVersion: apps/v1
kind: Deployment
metadata:
  name: lore-sentry
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lore-sentry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lore-sentry
    spec:
      containers:
        - name: lore-sentry
          image: lore-sentry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
