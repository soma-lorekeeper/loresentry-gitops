apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lore-sentry

# includeSelectors: false -- Deployment 의 selector 는 immutable 이므로
# 공통 라벨을 selector 에 주입하지 않는다.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: lore-sentry
      app.kubernetes.io/part-of: lore-sentry

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# CI 파이프라인이 새 이미지 태그를 여기에 커밋한다.
images:
  - name: lore-sentry
    newName: REPLACE_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/lore-sentry
    newTag: "0.1.0"
