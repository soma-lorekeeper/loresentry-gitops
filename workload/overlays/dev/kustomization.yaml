apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace.yaml
  - rbac.yaml
  - ../../base
  - ingress.yaml
  - openai-mock

images:
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/gateway/api
    newTag: build-43-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/ai-chat/api
    newTag: build-33-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/authentication/api
    newTag: build-27-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/content/api
    newTag: build-43-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/graph-rag/api
    newTag: build-29-1

replicas:
  - name: gateway-api
    count: 2

patches:
  - target:
      kind: ConfigMap
      name: postgres
    patch: |-
      - op: replace
        path: /data/host
        value: lore-sentry-dev-postgres.c1guoowwmnj7.ap-northeast-2.rds.amazonaws.com
  - target:
      kind: ConfigMap
      name: neptune
    patch: |-
      - op: replace
        path: /data/endpoint
        value: lore-sentry-dev-neptune.cluster-c1guoowwmnj7.ap-northeast-2.neptune.amazonaws.com
      - op: replace
        path: /data/reader-endpoint
        value: lore-sentry-dev-neptune.cluster-ro-c1guoowwmnj7.ap-northeast-2.neptune.amazonaws.com
  - target:
      kind: ConfigMap
      name: media
    patch: |-
      - op: replace
        path: /data/bucket
        value: loresentry-media-dev-197179613039
      - op: replace
        path: /data/public-base-url
        value: https://media-dev.loresentry.com
  - target:
      kind: ConfigMap
      name: refresh
    patch: |-
      - op: replace
        path: /data/bucket
        value: loresentry-refresh-dev-197179613039
  - target:
      kind: PrometheusRule
      name: lore-sentry-kafka
    patch: |-
      - op: replace
        path: /spec/groups/0/rules/4/expr
        value: up{namespace="dev", kubernetes_pod_name=~"lore-sentry-broker-[0-9]+"} == 0
      - op: replace
        path: /spec/groups/0/rules/5/expr
        value: |
          kubelet_volume_stats_available_bytes{namespace="dev", persistentvolumeclaim=~"data-[0-9]+-lore-sentry-broker-[0-9]+"}
            / kubelet_volume_stats_capacity_bytes{namespace="dev", persistentvolumeclaim=~"data-[0-9]+-lore-sentry-broker-[0-9]+"} < 0.15
  - target:
      kind: Deployment
      name: (ai-chat-api|ai-chat-summarizer|graph-rag-api)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENAI_BASE_URL
          value: http://openai-mock/v1
  # APM: span을 EDOT Collector(logging/base/otel-collector)로 보낸다. prod overlay에는 prod 로깅 스택을 세울 때 넣는다.
  # EDOT로 옮긴 서비스(docs APM_ARCHITECTURE.md 12절): 기본값은 보내지 않음(Java는 이미지의 otel-agent.properties, Python은
  # 이미지의 docker-entrypoint.sh)이고 여기서 켠다.
  # resource에 환경(Kibana APM의 환경 구분), namespace, 파드 이름을 넣는다. 파드 이름은 Downward API로 받아 service.instance.id
  # (Kibana APM의 인스턴스)로도 쓴다. 같은 env 목록에서 앞에 둔 변수만 $(이름)으로 읽을 수 있어 POD_NAME·POD_NAMESPACE를 먼저 둔다.
  # service.version은 이미지의 시작 스크립트가 APP_VERSION으로 앞에 붙인다
  - target:
      kind: Deployment
      name: (gateway-api|authentication-api|content-api|ai-chat-api|ai-chat-summarizer|graph-rag-api)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_EXPORTER
          value: otlp
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://edot-collector.monitoring.svc:4318
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment.name=dev,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),service.instance.id=$(POD_NAME)
  - target:
      kind: Deployment
      name: (gateway-api|authentication-api)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: profile
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: dev
  - target:
      kind: Deployment
      name: content-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: db-pool
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
                    value: "10"
                  - name: LOGGING_LEVEL_COM_LORESENTRY_CONTENT_DOCUMENT
                    value: WARN
                  - name: LOGGING_LEVEL_COM_LORESENTRY_CONTENT_EVENT
                    value: WARN
                  - name: LOGGING_LEVEL_COM_LORESENTRY_CONTENT_PROJECT
                    value: WARN
                resources:
                  limits:
                    cpu: "1"
  - target:
      kind: Deployment
      name: gateway-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: http-pool
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: LORESENTRY_HTTP_MAX_CONNECTIONS
                    value: "50"
                  - name: LORESENTRY_HTTP_MAX_CONNECTIONS_PER_ROUTE
                    value: "10"
                  - name: LOGGING_LEVEL_COM_LORESENTRY_GATEWAY_SECURITY
                    value: WARN
                  - name: LOGGING_LEVEL_COM_LORESENTRY_GATEWAY_APPLICATION
                    value: WARN
                  - name: LOGGING_LEVEL_COM_LORESENTRY_GATEWAY_WEB
                    value: WARN
  - target:
      kind: ConfigMap
      name: manuscript-key
    patch: |-
      - op: replace
        path: /data/key-id
        value: alias/lore-sentry-manuscript-dev
