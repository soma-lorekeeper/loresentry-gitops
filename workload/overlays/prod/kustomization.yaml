apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - rbac.yaml
  - ../../base
  - ingress.yaml

images:
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/gateway/api
    newTag: build-31-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/ai-chat/api
    newTag: build-25-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/authentication/api
    newTag: build-15-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/content/api
    newTag: build-36-1
  - name: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/graph-rag/api
    newTag: build-26-1

replicas:
  - name: gateway-api
    count: 2

patches:
  - target:
      kind: Deployment
      name: content-api
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
