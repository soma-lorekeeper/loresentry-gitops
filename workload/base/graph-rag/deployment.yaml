apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-rag-api
  labels:
    app.kubernetes.io/name: graph-rag-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-rag-api
  template:
    metadata:
      labels:
        app: graph-rag-api
        app.kubernetes.io/name: graph-rag-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      serviceAccountName: graph-rag-api
      terminationGracePeriodSeconds: 420
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/graph-rag/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_POLLING_ENABLED
              value: "false"
            - name: KAFKA_PROJECT_CHANGED_ENABLED
              value: "true"
            - name: KAFKA_REFRESH_REQUESTED_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka
                  key: bootstrap-servers
            - name: NEPTUNE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: neptune
                  key: endpoint
            - name: NEPTUNE_READER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: neptune
                  key: reader-endpoint
            - name: NEPTUNE_PORT
              valueFrom:
                configMapKeyRef:
                  name: neptune
                  key: port
            - name: GRAPH_REFRESH_COMPLETED_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: refresh
                  key: bucket
            - name: GRAPH_REFRESH_REQUEST_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: refresh
                  key: bucket
            - name: GRAPH_REFRESH_REGION
              valueFrom:
                configMapKeyRef:
                  name: refresh
                  key: region
            - name: CONTENT_BASE_URL
              value: http://content-api
            - name: OPENAI_MODEL
              value: gpt-6-luna
            - name: OPENAI_MAX_INPUT_TOKENS
              value: "922000"
            - name: OPENAI_CONTEXT_WINDOW
              value: "1050000"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chat-openai
                  key: OPENAI_API_KEY
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
