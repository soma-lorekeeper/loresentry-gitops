apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chat-summarizer
  labels:
    app.kubernetes.io/name: ai-chat-summarizer
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chat-summarizer
  template:
    metadata:
      labels:
        app: ai-chat-summarizer
        app.kubernetes.io/name: ai-chat-summarizer
        app.kubernetes.io/part-of: lore-sentry
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: summarizer
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/ai-chat/api:bootstrap
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.summarizer"]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: ai-chat-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-chat-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-chat-db
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka
                  key: bootstrap-servers
            - name: OPENAI_MODEL
              value: gpt-6-luna
            - name: SUMMARY_REASONING_EFFORT
              value: low
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chat-openai
                  key: OPENAI_API_KEY
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/summarizer-heartbeat) )) -lt 300
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
