apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
        app.kubernetes.io/name: gateway-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway-api
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/gateway/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            # prod 프로필이 없으면 application-prod.yaml 을 읽지 않아 쿠키·CORS·세션 설정이 모두 빠진다.
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # auth 와 같은 키 쌍의 공개키다. BFF 는 개인키를 갖지 않는다.
            - name: BFF_JWT_PUBLIC_KEY
              value: /app/keys/auth-public.pem
            - name: BFF_SESSION_REDIS_HOST
              value: auth-valkey
            - name: BFF_SESSION_REDIS_PORT
              value: "6379"
            - name: BFF_SESSION_REDIS_TLS
              value: "false"
          envFrom:
            # BFF_JWT_KEY_ID, BFF_SESSION_REDIS_USERNAME · PASSWORD
            - secretRef:
                name: gateway-runtime
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: jwt-public
              mountPath: /app/keys
              readOnly: true
      volumes:
        - name: jwt-public
          configMap:
            name: authentication-jwt-public
