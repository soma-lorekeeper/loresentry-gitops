apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
        app.kubernetes.io/name: gateway-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      terminationGracePeriodSeconds: 180
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway-api
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/gateway/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            # prod 프로필이 없으면 application-prod.yaml 을 읽지 않아 쿠키·CORS·세션 설정이 모두 빠진다.
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # auth 와 같은 키 쌍의 공개키다. BFF 는 개인키를 갖지 않는다.
            - name: BFF_JWT_PUBLIC_KEY
              value: /app/keys/auth-public.pem
            - name: BFF_SESSION_REDIS_HOST
              value: auth-valkey
            - name: BFF_SESSION_REDIS_PORT
              value: "6379"
            - name: BFF_SESSION_REDIS_TLS
              value: "false"
            - name: LORESENTRY_CHAT_ALLOWED_USERS
              value: "*"
          envFrom:
            # BFF_JWT_KEY_ID, BFF_SESSION_REDIS_USERNAME · PASSWORD
            - secretRef:
                name: gateway-runtime
          ports:
            - name: http
              containerPort: 8000
          # 기동이 끝날 때까지 readiness·liveness를 미룬다. EDOT Java agent가 기동 중 클래스에 계측을 붙여 기동이 늘어난다(auth는 dev에서
          # 45초 → 63초, CPU 요청 100m). liveness(20초 뒤부터 20초마다, 3번 실패하면 재시작)만으로는 기동 중에 재시작될 수 있다. 5초마다 보고
          # 36번(3분)까지 기다린다
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              # EDOT Java agent(계측 클래스, span 버퍼)가 메모리를 더 쓴다(auth 로컬 실측 약 50MiB). dev의 gateway는 agent 전에도 312~323Mi로
              # 512Mi의 75%(heap 상한)에 가까웠다. heap 상한은 이미지 시작 스크립트가 이 값의 75%로 정한다
              memory: 768Mi
          volumeMounts:
            - name: jwt-public
              mountPath: /app/keys
              readOnly: true
      volumes:
        - name: jwt-public
          configMap:
            name: authentication-jwt-public
