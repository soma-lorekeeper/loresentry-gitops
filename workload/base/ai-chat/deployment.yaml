apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chat-api
  labels:
    app.kubernetes.io/name: ai-chat-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chat-api
  template:
    metadata:
      labels:
        app: ai-chat-api
        app.kubernetes.io/name: ai-chat-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      serviceAccountName: ai-chat-api
      terminationGracePeriodSeconds: 190
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/ai-chat/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: ai-chat-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-chat-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-chat-db
                  key: password
            - name: CONTENT_BASE_URL
              value: http://content-api
            - name: OPENAI_MODEL
              value: gpt-6-luna
            - name: OPENAI_REASONING_EFFORT
              value: medium
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chat-openai
                  key: OPENAI_API_KEY
            - name: MANUSCRIPT_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: manuscript-key
                  key: key-id
            - name: MANUSCRIPT_KEY_REGION
              valueFrom:
                configMapKeyRef:
                  name: manuscript-key
                  key: region
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
