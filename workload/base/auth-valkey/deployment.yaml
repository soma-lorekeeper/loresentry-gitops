apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-valkey
  labels:
    app.kubernetes.io/name: auth-valkey
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  # A second replica would be a second independent cache, not a bigger one,
  # so restarts replace the pod instead of running two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-valkey
  template:
    metadata:
      labels:
        app: auth-valkey
        app.kubernetes.io/name: auth-valkey
        app.kubernetes.io/part-of: lore-sentry
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0.6-alpine
          imagePullPolicy: IfNotPresent
          # requirepass 를 넘기지 않는다. aclfile 을 쓰면 valkey 가 requirepass 를 무시하고
          # default 를 nopass +@all 로 두므로, 그 조합은 비밀번호가 걸린 것처럼 보이면서
          # 실제로는 클러스터 어느 pod 든 비밀번호 없이 세션을 읽고 쓸 수 있는 상태가 된다.
          # 로컬 valkey 9.0.6 에서 확인했다. 접근 통제는 ACL 파일 하나가 맡는다.
          command:
            - sh
            - -c
            - exec valkey-server /etc/valkey/valkey.conf
          ports:
            - name: valkey
              containerPort: 6379
          # default 를 껐으므로 프로브도 계정이 필요하다. ACL 의 probe 계정은 PING 만
          # 할 수 있고 비밀 값이 없어, 프로브에 주입할 자격 증명도 없다.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --user probe --pass probe --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --user probe --pass probe --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: acl
              mountPath: /etc/valkey/acl
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: auth-valkey
        - name: acl
          secret:
            secretName: authentication-valkey-acl
        - name: data
          # emptyDir 이었다. 세션이 여기 있으므로 pod 재시작이 전원 로그아웃이 된다.
          persistentVolumeClaim:
            claimName: auth-valkey-data
