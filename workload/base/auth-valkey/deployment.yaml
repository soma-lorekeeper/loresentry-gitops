apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-valkey
  labels:
    app.kubernetes.io/name: auth-valkey
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  # A second replica would be a second independent cache, not a bigger one,
  # so restarts replace the pod instead of running two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-valkey
  template:
    metadata:
      labels:
        app: auth-valkey
        app.kubernetes.io/name: auth-valkey
        app.kubernetes.io/part-of: lore-sentry
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0.6-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec valkey-server /etc/valkey/valkey.conf --requirepass "$VALKEY_PASSWORD"
          env:
            # requirepass 는 default 계정용으로 남겨 둔다. 실제 서비스는 ACL 파일의
            # authentication·bff 계정으로 붙으므로 이 값으로는 세션 키에 닿지 못한다.
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: acl
              mountPath: /etc/valkey/acl
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: auth-valkey
        - name: acl
          secret:
            secretName: authentication-valkey-acl
        - name: data
          # emptyDir 이었다. 세션이 여기 있으므로 pod 재시작이 전원 로그아웃이 된다.
          persistentVolumeClaim:
            claimName: auth-valkey-data
