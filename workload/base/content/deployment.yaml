apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-api
  labels:
    app.kubernetes.io/name: content-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-api
  template:
    metadata:
      labels:
        app: content-api
        app.kubernetes.io/name: content-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      serviceAccountName: content-api
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/content/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: content-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: content-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: content-db
                  key: password
            - name: MEDIA_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: media
                  key: bucket
            - name: MEDIA_REGION
              valueFrom:
                configMapKeyRef:
                  name: media
                  key: region
            - name: MEDIA_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: media
                  key: public-base-url
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
