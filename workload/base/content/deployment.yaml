apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-api
  labels:
    app.kubernetes.io/name: content-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-api
  template:
    metadata:
      labels:
        app: content-api
        app.kubernetes.io/name: content-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      serviceAccountName: content-api
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/content/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: content-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: content-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: content-db
                  key: password
            - name: MEDIA_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: media
                  key: bucket
            - name: MEDIA_REGION
              valueFrom:
                configMapKeyRef:
                  name: media
                  key: region
            - name: MEDIA_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: media
                  key: public-base-url
            - name: GRAPH_REFRESH_REQUEST_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: refresh
                  key: bucket
            - name: GRAPH_REFRESH_COMPLETED_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: refresh
                  key: bucket
            - name: GRAPH_REFRESH_REGION
              valueFrom:
                configMapKeyRef:
                  name: refresh
                  key: region
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka
                  key: bootstrap-servers
            - name: MANUSCRIPT_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: manuscript-key
                  key: key-id
            - name: MANUSCRIPT_KEY_REGION
              valueFrom:
                configMapKeyRef:
                  name: manuscript-key
                  key: region
          ports:
            - name: http
              containerPort: 8000
          # 기동이 끝날 때까지 readiness·liveness를 미룬다. EDOT Java agent가 기동 중 클래스에 계측을 붙여 기동이 늘어난다(auth는 dev에서
          # 45초 → 63초, CPU 요청 100m). liveness(20초 뒤부터 20초마다, 3번 실패하면 재시작)만으로는 기동 중에 재시작될 수 있다. 5초마다 보고
          # 36번(3분)까지 기다린다
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # EDOT Java agent(계측 클래스, span 버퍼)가 메모리를 더 쓴다(auth 로컬 실측 약 50MiB). dev의 content는 agent 전에도 365Mi로
              # 512Mi의 75%(heap 상한)에 가까웠다. heap 상한은 이미지 시작 스크립트가 이 값의 75%로 정한다
              memory: 768Mi
