apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-api
  labels:
    app.kubernetes.io/name: content-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-api
  template:
    metadata:
      labels:
        app: content-api
        app.kubernetes.io/name: content-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/content/api:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
