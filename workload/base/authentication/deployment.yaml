apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-api
  labels:
    app.kubernetes.io/name: authentication-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-api
  template:
    metadata:
      labels:
        app: authentication-api
        app.kubernetes.io/name: authentication-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/authentication/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: authentication-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authentication-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentication-db
                  key: password
            # Google OAuth 와 JWT 서명 설정. auth 의 GoogleProperties·JwtProperties 가
            # @NotBlank 이므로 하나라도 비면 컨텍스트가 뜨지 않는다 — 값이 없으면 기동 실패다.
            # 세션 저장소 주소도 여기 있다. 기본값(localhost)으로는 기동만 되고 로그인이 실패한다.
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: AUTH_JWT_PUBLIC_KEY_PATH
              value: /app/keys/auth-public.pem
            - name: SPRING_DATA_REDIS_HOST
              value: auth-valkey
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            # outbox relay 가 UserDeleted 를 보낼 Kafka 주소. 값이 없어도 기동은 되지만 앱이
            # localhost:9092 로 붙으려 해서, 탈퇴가 일어난 뒤부터 relay 가 발행에 계속 실패한다.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka
                  key: bootstrap-servers
          envFrom:
            # AUTH_GOOGLE_CLIENT_ID · CLIENT_SECRET · REDIRECT_URI,
            # AUTH_JWT_PRIVATE_KEY_BASE64 · KEY_ID,
            # SPRING_DATA_REDIS_USERNAME · PASSWORD
            - secretRef:
                name: authentication-runtime
          ports:
            - name: http
              containerPort: 8000
          # 기동이 끝날 때까지 readiness·liveness를 미룬다. EDOT Java agent가 기동 중 클래스에 계측을 붙여 기동이 dev에서 45초에서 63초로
          # 늘었다(CPU 요청 100m). liveness(20초 뒤부터 20초마다, 3번 실패하면 재시작)만으로는 기동 중에 재시작될 수 있다. 5초마다 보고
          # 36번(3분)까지 기다린다
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # EDOT Java agent(계측 클래스, span 버퍼)가 메모리를 더 쓴다. 로컬 실측(2026-11-05) 시작 직후 357MiB, 요청 1,500개 뒤
              # 382MiB로 512Mi의 75%(heap 상한) 근처라 늘린다. heap 상한은 이미지 시작 스크립트가 이 값의 75%로 정한다
              memory: 768Mi
          volumeMounts:
            # 공개키는 비밀이 아니므로 ConfigMap 이다. 개인키는 Secret 의 env 로만 들어간다.
            - name: jwt-public
              mountPath: /app/keys
              readOnly: true
      volumes:
        - name: jwt-public
          configMap:
            name: authentication-jwt-public
