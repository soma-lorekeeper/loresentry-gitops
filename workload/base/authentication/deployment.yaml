apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-api
  labels:
    app.kubernetes.io/name: authentication-api
    app.kubernetes.io/part-of: lore-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-api
  template:
    metadata:
      labels:
        app: authentication-api
        app.kubernetes.io/name: authentication-api
        app.kubernetes.io/part-of: lore-sentry
    spec:
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/authentication/api:bootstrap
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: authentication-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authentication-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentication-db
                  key: password
            # Google OAuth 와 JWT 서명 설정. auth 의 GoogleProperties·JwtProperties 가
            # @NotBlank 이므로 하나라도 비면 컨텍스트가 뜨지 않는다 — 값이 없으면 기동 실패다.
            # 세션 저장소 주소도 여기 있다. 기본값(localhost)으로는 기동만 되고 로그인이 실패한다.
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: AUTH_JWT_PUBLIC_KEY_PATH
              value: /etc/auth/jwt/auth-public.pem
            - name: SPRING_DATA_REDIS_HOST
              value: auth-valkey
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          envFrom:
            # AUTH_GOOGLE_CLIENT_ID · CLIENT_SECRET · REDIRECT_URI,
            # AUTH_JWT_PRIVATE_KEY_BASE64 · KEY_ID,
            # SPRING_DATA_REDIS_USERNAME · PASSWORD
            - secretRef:
                name: authentication-runtime
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # 공개키는 비밀이 아니므로 ConfigMap 이다. 개인키는 Secret 의 env 로만 들어간다.
            - name: jwt-public
              mountPath: /etc/auth/jwt
              readOnly: true
      volumes:
        - name: jwt-public
          configMap:
            name: authentication-jwt-public
