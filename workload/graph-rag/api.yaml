apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-rag-api
  namespace: graph-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-rag-api
  template:
    metadata:
      labels:
        app: graph-rag-api
    spec:
      containers:
        - name: api
          image: 197179613039.dkr.ecr.ap-northeast-2.amazonaws.com/graph-rag/api:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: graph-rag-api
  namespace: graph-rag
spec:
  type: ClusterIP
  selector:
    app: graph-rag-api
  ports:
    - name: http
      port: 80
      targetPort: http
