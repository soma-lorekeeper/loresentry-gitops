# App-of-Apps 루트 애플리케이션.
# 최초 1회만 수동 적용한다:
#   kubectl apply -n argocd -f bootstrap/root-application.yaml
# 이후 clusters/production 아래의 변경은 Argo CD가 자동으로 동기화한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/soma-lorekeeper/soma-loresentry-gitops.git
    targetRevision: main
    path: clusters/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
